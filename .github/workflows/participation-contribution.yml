name: participation-contribution

# Contribution acceptance for every client, including those that never load .claude/settings.json.
# A PR's receipt names its claim (coordination.task_ref) and session. This check asks whether that claim
# covered the PR's changed files when its head commit was made, and whether it still does (assurance:
# admitted-current, admitted-historical, legacy-declared or none). It reads public issue comments only.
# Not a required check until the integrator and founder adopt it (#346, Decision A).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  contribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "jsonschema>=4.20,<5"
      - name: Claim, files and commit time agree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/participation.py contribution --pr "${{ github.event.pull_request.number }}"
