# SP-5 / SP-6 / SP-7 / SP-8 — route tournament, two strengthening passes, decision.
#
# Every branch below was scored AFTER being attacked, not before. Hard gates were
# applied first; a branch that fails a hard gate is recorded with its reason and
# not scored, because scoring a disqualified branch invites resurrecting it later
# on the strength of a number it never earned.
#
# Exactly two strengthening passes (Override / prompt §14). There is no third.

nodes:
  # ------------------------------------------------------ the controlling fact
  - id: decision.controlling_fact
    kind: finding
    title: The controlling fact — nothing has ever crossed into reality
    evidence_status: verified_by_execution
    statement: >-
      Across six repositories, 184 branches, 69 open pull requests and 517 passing
      tests, the number of externally verified consequences is zero. Not low — zero.
      The canonical-v1 release record states it, the linker confirms no organ
      consumes a kernel grant, and there is no server, daemon or loop that could
      produce one.
    why_this_orders_everything: >-
      Every autonomy threshold, evidence gate, routing weight and calibration
      constant in the system is uncalibrated theory until one loop closes against
      something outside the repository. That makes "which loop can close first, with
      the fewest external dependencies" the only question whose answer changes what
      to build tomorrow.
    refs: [anatomy.kernel_is_a_library_not_a_running_system, bridge.status_a_through_h]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        path: docs/release/canonical-v1/00-README.md
        command: "linker report; find -name __main__.py; pytest"

  # ----------------------------------------------------------------- hard gates
  - id: tree.hard_gates
    kind: strategy_gate
    title: Hard gates applied before scoring
    evidence_status: verified_by_inspection
    gates:
      - violates Constitution or law
      - destroys evidence or branches
      - requires unavailable authority
      - cannot be tested before major cost
      - has no causal connection to the actual egregore
      - relies on impressive naming instead of mechanism
      - cannot beat or complement a conventional baseline
      - creates unbounded blast radius
      - makes the evaluator candidate-controlled
      - depends on a nonexistent external acceptance path with no bridge
    evidence_refs:
      - repo: founder-upload
        sha: 1fd49e07437d53c6ac708e4a3871272acd1fd2a1507acc95bbd0599de7468c9e
        symbol: "§12 hard gates"

