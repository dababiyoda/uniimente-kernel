# Scope-drift detection and correction, plus the permanent meta-rules the
# founder installed in the continuation order.
#
# The drift node is recorded on the branch that drifted, deliberately. An
# institution that detects its own boundary violations must keep the record where
# the violation happened, not only where it was fixed.

nodes:
  - id: drift.pr68_planning_runtime_scope
    kind: self_detected_drift
    title: "PR #68 crossed its planning-only boundary — detected, separated, preserved"
    evidence_status: verified_by_execution
    detected_by: founder
    what_happened: >-
      PR #68 declared planning-only scope: no runtime change, and deleting the
      planning trees would leave the kernel byte-identical to main. Commit
      d8c921552660675485f347637f8be08d6880f7cc landed runtime/contract.py, an
      __init__ and a guard-test module on that branch under the founder's P0/P1
      authorization. The work was authorized. Its location was not. The PR body
      continued to claim planning-only while the head carried runtime code.
    why_it_matters: >-
      This is precisely the class of drift UNIIMENTE exists to catch in itself: a
      stated boundary and an actual diff diverging, with the human-readable
      description remaining plausible. Nothing about the work was wrong; the
      record stopped being true.
    correction_applied:
      - "created claude/track-a-runtime-spine from main @ 8cb3074, a clean base"
      - "transferred runtime/contract.py byte-identically (sha256 e052a3c8...), CONTRACT_SHA256 unchanged"
      - "PR #68 corrected by an ordinary forward commit removing the runtime files"
      - "no Git history rewritten; d8c9215 remains in PR #68's record as evidence"
      - "runtime/PROVENANCE.md on Track A carries the full lineage and the reason"
    what_was_deliberately_not_done:
      - rebase or force-push
      - deleting the drifting commit
      - amending the PR body to pretend the boundary was always respected
    resulting_topology: >-
      PR #68 is the canonical super-planning decision genome. The Track-A PR is
      the bounded runtime implementation it authorizes. One canonical decision
      record -> separate bounded implementation -> evidence -> promotion only
      after proof.
    lesson_for_the_institution: >-
      An authorization to build is not an authorization to build anywhere. Scope
      is a property of the branch, not only of the work. Future authorizations
      should name the lineage as well as the phase.
    refs: [authorization.p0_p1, intent.anti_self_deception, intent.supersession_matrix]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: d8c921552660675485f347637f8be08d6880f7cc
        command: "git diff --name-only main...HEAD | grep -E '^(runtime/|tests/)'"
        note: "runtime/__init__.py runtime/contract.py tests/unit/test_runtime_contract_frozen.py"

  - id: meta.intent_conservation_test
    kind: protected_intent
    title: "PERMANENT META-RULE — Intent Conservation Test"
    evidence_status: verified_by_inspection
    protected: true
    override_section: "continuation-2"
    rule: >-
      Founder intent is the FLOOR, not necessarily the ceiling. Search upward for
      a better mechanism; never downward for an easier destination.
    questions_before_every_material_decision:
      A: Which protected founder intentions does this advance?
      B: Does it accidentally reduce a long-range intended capability because the present implementation is easier?
      C: Does it confuse "not proven today" with "not intended"?
      D: Does it create a local optimum that makes later development harder?
      E: Does it increase dependency on one model, vendor, implementation, repository or topology?
      F: Does it increase Alfonso's future operational burden?
      G: Does it create more reusable capability than the narrow task requires?
      H: Does it preserve rollback and ancestry?
      I: Does it improve the institution or merely improve the benchmark?
      J: Is a simpler architecture still winning?
    enforcement: "A material decision that cannot answer these must not silently land."
    evidence_refs:
      - repo: founder-instruction
        sha: continuation-order-2026-08-08
        symbol: "§2 Intent Conservation Test"

  - id: meta.upward_synthesis
    kind: protected_intent
    title: "PERMANENT META-RULE — Upward Synthesis Proposal"
    evidence_status: verified_by_inspection
    protected: true
    override_section: "continuation-1"
    rule: >-
      You may improve HOW an intention is achieved. You may not silently change
      WHAT the protected intention means. Never convert an architectural
      preference into founder intent.
    required_fields:
      - founder intention preserved
      - limitation in the founder-proposed mechanism
      - stronger mechanism discovered
      - why it better achieves the same or broader intended outcome
      - evidence
      - simplest competing architecture
      - additional complexity introduced
      - new failure modes
      - falsification test
      - rollback
      - whether founder approval is required
    review_points: [P2, P3, P4, P6, P8, P10]
    discipline: "GENERALIZE EARNED MECHANISMS. DO NOT GENERALIZE METAPHORS."
    evidence_refs:
      - repo: founder-instruction
        sha: continuation-order-2026-08-08
        symbol: "§16 Upward synthesis after each phase"

  - id: meta.capability_dividend
    kind: protected_intent
    title: "PERMANENT META-RULE — Capability Dividend"
    evidence_status: verified_by_inspection
    protected: true
    override_section: "continuation-3"
    rule: >-
      Every important development should attempt to produce more than its local
      deliverable — but do not artificially generalize everything.
    per_phase_extraction:
      - LOCAL RESULT — what exact problem was solved
      - REUSABLE PRIMITIVE — what mechanism another organ can use
      - GENERAL CAPABILITY — what larger class of problems is now solvable
      - DEVELOPMENTAL LEARNING — what UNIIMENTE learned about creating capabilities
      - EVALUATOR ASSET — what new protected test or falsification mechanism exists
      - LINEAGE ASSET — what failure, alternative, benchmark or counterfactual is preserved
      - ECONOMIC OPTION — could this later reduce cost, create revenue or become licensable
      - FUTURE UNLOCK — which harder aspirations became easier
    compounding_structure: >-
      solve problem -> extract reusable mechanism -> register capability -> use
      capability to solve larger problem -> extract stronger mechanism -> repeat
    evidence_refs:
      - repo: founder-instruction
        sha: continuation-order-2026-08-08
        symbol: "§3 Capability Dividend"

