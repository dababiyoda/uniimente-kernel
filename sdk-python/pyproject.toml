[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uniimente-kernel"
version = "0.8.0"
description = "UNIIMENTE Kernel SDK: shared governance modules for constitutionally governed organs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Alfonso Lopez"}]
dependencies = []

[project.urls]
Repository = "https://github.com/dababiyoda/uniimente-kernel"

[tool.setuptools.packages.find]
include = ["uniimente_kernel*"]
