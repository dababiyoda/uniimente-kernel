# FOUNDER AUTHORIZATION — P0/P1, the four FD answers, and one architectural
# correction that supersedes this round's own recommendation.
#
# Recorded 2026-08-08 from founder instruction in session. These nodes have
# authority over the round's earlier output where they conflict: the founder
# corrected the construction phase, and Override §2/§28 require the supersession
# to be visible on both sides rather than silently applied.

nodes:
  - id: correction.runtime_spine_supersedes_isolated_firewall
    kind: founder_correction
    title: "CORRECTION — the Evaluator Firewall belongs inside the Runtime Spine, not beside it"
    evidence_status: verified_by_inspection
    supersedes: program.pr_stack.P1
    supersedes_note: >-
      This round's P1 proposed the evaluator firewall as a standalone subsystem.
      The founder corrected it: build the firewall as part of the first
      consequence-inert Runtime Spine, and make the first developmental closure
      occur THROUGH that runtime. The superseded formulation is preserved above
      rather than rewritten, per Override §28.
    founder_reasoning: >-
      Otherwise the round's own strongest counterargument lands — UNIIMENTE could
      repair a capability that nothing uses and still appear to have improved.
    why_this_is_right: >-
      It converts the round's stated weakness into a structural fix instead of a
      caveat. The earlier design answered "a closure over an unconsumed capability"
      by labelling the tier honestly; this answers it by making the capability
      consumed. A label prevents the wrong claim; the runtime prevents the wrong
      outcome. That is strictly stronger.
    diagnosis_accepted: >-
      Static existence is not operational existence. Many modules exist, many
      tests pass, many contracts are defined, sophisticated experiments exist —
      and there is no persistent whole-body process, no runtime contract consumer,
      no active adapter topology, no continuous mission loop, and no end-to-end
      developmental cycle. An institutional library, not yet the operating egregore.
    refs: [program.pr_stack, anatomy.kernel_is_a_library_not_a_running_system, route.11_execution_surface_first, decision.final]
    evidence_refs:
      - repo: founder-instruction
        sha: session-2026-08-08
        symbol: "Correct next construction phase — P0/P1 Consequence-Inert Runtime Spine + Evaluator Firewall"

  - id: sbm.strengthened_closure_definition
    kind: decision
    title: "Strengthened SBM — twelve conditions a closure must satisfy"
    evidence_status: verified_by_inspection
    metric: VERIFIED_DEVELOPMENTAL_CLOSURES
    baseline: 0
    target: 1
    supersedes: decision.final.first_decisive_proof
    supersedes_note: >-
      The metric name, baseline and target are unchanged. The DEFINITION is
      strengthened so it cannot pass as a detached laboratory demonstration.
    conditions:
      1: A running consequence-inert UNIIMENTE process detects the function loss.
      2: The target function is actually consumed by that running process.
      3: Candidate implementations are generated after the evaluator is frozen.
      4: Candidates cannot inspect, modify, or influence decisive held-out evaluation.
      5: At least one valid candidate builds and executes.
      6: The replacement is attached only to an experimental capability registry.
      7: The runtime routes work through the replacement.
      8: The disabled function is demonstrably restored.
      9: Authority, identity, evidence and shutdown invariants remain unchanged.
      10: Rollback restores the prior state.
      11: The episode survives a forced restart.
      12: Every candidate, result, failure and lineage edge is preserved.
    disqualifying: >-
      A detached benchmark does not count. Prewritten-candidate selection does not
      count. Conditions 2 and 7 are the ones that close this round's strongest
      objection, and neither is satisfiable by a test fixture.
    refs: [correction.runtime_spine_supersedes_isolated_firewall, decision.final, intent.closure_ladder]
    evidence_refs:
      - repo: founder-instruction
        sha: session-2026-08-08
        symbol: "Strengthened Single Bottleneck Metric — 12 conditions"

