# Function owners — 2026-10-30 (directive 2026-10-28 sections 3, 52 and 76; work unit MU-H).
# The concern records above name a repository or package. These name, per important FUNCTION, the module
# that owns it on the mission path, every other implementation with its status (ALTERNATE, HISTORICAL,
# RESEARCH, RETIRED) and the condition that retires or revives it. owner_status NEEDS_FOUNDER_DECISION means
# the evidence does not settle the owner; the candidates and the evidence on each side are recorded instead.
# Owners were read from what greg/ and the CLI import and call at b1950be2, not chosen.
# Checked by tests/unit/test_canonical_owner_guard.py (mutants: scripts/ci/check_canonical_owner_guard_mutants.py).
# The test pins every record, entry and canonical module set: removing one, adding a second canonical module, or
# resolving a NEEDS_FOUNDER_DECISION record without a founder_ruling (an accepted decision or active intent record
# that names the record) fails until the pin in the test changes in the same reviewed diff. Adding a candidate, an
# alternate or a distinct entry needs no test change.
# Status: PROPOSED, like every record in this file. A status here attaches, activates, retires or grants nothing.
function_owner_records:

  - record_id: OWN-FN-TEMPORARY-TEAMS
    function: temporary specialist teams
    effect: >-
      a team formed for one bounded objective acts only inside the intersection of each member's capabilities with
      the grant, within its budget, and every act after it dissolves is refused
    refines: [OWN-0008, OWN-SR-001]
    owner_status: CANONICAL
    canonical:
      - module: foundry.systems.teams
        qualnames: [form, act, dissolve, report]
    evidence:
      - "foundry/systems/__init__.py: SYSTEMS[48] is 'teams'; ALTERNATES registers no second implementation of #48"
      - >-
        mission path: the foundry.apply and foundry.query builtins (greg/capabilities.py BUILTINS) call
        greg/foundry_bridge.py _call, which resolves foundry.systems.implementation_for(48, op) to teams.APPLY_OPS
        form/act/dissolve and QUERY_OPS report
      - "omnimorph is imported by foundry/pipeline.py and closure/advantage_registry.py only; no module under greg/ imports it"
      - "OWN-SR-001 above: organization_design is omnimorph/ (subordinate, not activated)"
    alternates:
      - module: omnimorph.engine
        qualnames: [OmnimorphEngine, OrganManifest]
        status: RESEARCH
        reason: >-
          composes a temporary organ manifest from a passed Advantage Architecture, a Composition Plan and registered
          genomes; it simulates and records ratification and a Gate receipt but never acts. FOUNDER_EFFECT_COMPILER
          keeps OMNIMORPH as an optional organization-design mechanism, not the team runtime
        revival_condition: >-
          a measured CapabilityDeficit where organization topology, not member capability, is the bottleneck, and an
          OMNIMORPH-composed organ closes it where a #48 team formed under the same grant does not
          (FOUNDER_EFFECT_COMPILER resourcefulness ladder, step 9)
    distinct:
      - module: greg.mcp_tools
        qualnames: [act]
        why: "the mcp.act capability: one MCP tool call inside exactly what the founder signed for that use, not a team's act"
    migration_path: >-
      a GREG-level team runner (the program's WU-03 greg/teams.py) forms its teams through #48 on foundry.apply, or is
      recorded here as an ALTERNATE with its retirement condition; the guard refuses it otherwise
    # A registered name defined in at least three other guarded modules is not checked by name (the structural copy
    # check still applies); the test refuses a name that is not that common.
    generic_names: [report]
    markers:
      - '_?([A-Z][A-Za-z0-9]*)?Teams?([A-Z][A-Za-z0-9]*)?'
      - '_?([A-Z0-9]+_)*TEAMS?(_[A-Z0-9]+)*'
      - '_?([a-z0-9]+_)*teams?(_[a-z0-9]+)*'
      - '_?([A-Z][A-Za-z0-9]*)?(Omnimorph|OrganManifest)([A-Z][A-Za-z0-9]*)?'

  - record_id: OWN-FN-COMMERCE-CLOSURE
    function: one customer case closed in commercial order
    effect: >-
      an offer, a payment reconciled to the cent against the founder's exported statement, delivery, the buyer's
      confirmation and a settlement record, in that order, with GREG contacting, charging and paying no one
    refines: [OWN-0008]
    owner_status: CANONICAL
    canonical:
      - module: greg.business_loop
        qualnames: [reconcile]
      - module: greg.templates
        qualnames: [business_case, business_loop_amount]
      - module: greg.path
        qualnames: [business_loop_closed]
    evidence:
      - "greg/path.json node N3 is measured by greg.path.business_loop_closed; its components name greg/templates.py business_case and business.reconcile (greg/business_loop.py)"
      - "business_loop_closed counts only missions whose success check uses business.reconcile, and drops every row with fixture evidence (FOUNDER_TIER_RULE)"
      - "`greg mission new business-case` (greg/cli.py) builds the signed spec with templates.business_case"
    alternates:
      - module: greg.venture_rehearsal
        qualnames: [venture_rehearsal, plan]
        status: ALTERNATE
        reason: >-
          a FIXTURE rehearsal of the Foundry company loop (#49 media_company and #54 offers, through foundry.apply),
          reached from `greg rehearse` (greg/rehearsal.py) and the console's venture-rehearsal proposal; by its own
          docstring it is not evidence that anyone would buy anything, and it never moves N3
        retirement_condition: >-
          a founder-tier business case closes on a body (business_loop_closed met) and what only the rehearsal shows,
          the #49 and #54 stores cooperating on one transaction, is covered by tests/unit/test_foundry_systems.py
      - module: business.commercial_loop
        qualnames: [CommercialLoop, STAGES]
        status: ALTERNATE
        reason: >-
          the Kernel's phase-7 commercial loop runner (CommercialLoop, which advances a CustomerCase through STAGES),
          whose stage order greg/business_loop.py follows. CommercialLoop is imported by closure/commercial_registry.py
          only, and by no module under greg/. The module itself is not dormant: foundry/outcome_bridge.py (imported
          by foundry/__init__.py, so loaded whenever greg's foundry.apply path imports foundry.systems), #37
          marketplace and #54 agent_commerce import its observation vocabulary, recorded as distinct below
        retirement_condition: >-
          GREG's business case checks the same STAGES (a parity test pins one order), or the founder retires the
          phase-7 closure in closure/commercial_registry.py; either way ACCEPTED_VERIFICATIONS, OBSERVED,
          observation_problems and CustomerCase stay importable (or move together with foundry/outcome_bridge.py,
          foundry/systems/marketplace.py and foundry/systems/agent_commerce.py), because the Foundry reads them
    distinct:
      - module: business.commercial_loop
        qualnames: [ACCEPTED_VERIFICATIONS, OBSERVED, CustomerCase, observation_problems]
        why: >-
          the observation vocabulary (which verifications count, when a customer or payment is observed) and the
          case record that foundry/outcome_bridge.py, #37 marketplace and #54 agent_commerce import on greg's
          foundry.apply path; not part of the CommercialLoop runner, and it stays when that runner retires
      - module: foundry.systems.media_company
        qualnames: [assemble, reconcile]
        why: >-
          the #49 store the rehearsal drives; its reconcile reconciles the #49 assembly state, not a customer case.
          Its pluralism is governed by foundry.systems.ALTERNATES and foundry/completion.yaml
      - module: foundry.systems.offers
        qualnames: [fulfill]
        why: "the #54 store the rehearsal drives; same registry"
      - module: greg.cognition.settlement
        qualnames: [reconcile]
        why: "appends revisions to a mission's cognition credit from its observations; settles credit, not money"
      - module: greg.metrics
        qualnames: [STAGES]
        why: "the stage names of the sandbox whole-machine measure, not a commercial order"
      - module: foundry.systems.promotion
        qualnames: [STAGES]
        why: "the #16 promotion pipeline (spec to ratification), not a commercial order"
    migration_path: >-
      a second commercial runtime on the mission path is recorded here first; the real case stays the one
      business_loop_closed counts
    markers:
      - '_?business_(case|loop)(_[a-z0-9]+)*'
      - '_?(venture|commerce|commercial|business|company)_rehearsal(_[a-z0-9]+)*'
      - '_?([A-Z][A-Za-z0-9]*)?Commercial(Loop|Case)([A-Z][A-Za-z0-9]*)?'
      - '_?commercial_(loop|case|closure)(_[a-z0-9]+)*'

