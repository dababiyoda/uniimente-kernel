route_a_finding:
  question: Does a legitimate Kernel-resident consumer of LinkReport exist?
  answer: NO — the only in-kernel consumer is a self-check, not a dependent function.
  evidence:
    file: closure/kernel_registry.py
    lines: [924, 950, 962, 972]
    what_they_are: >-
      linker_technical, linker_evidence, linker_economic and linker_regenerative
      are ModuleClosures health probes. They call InstitutionalLinker(...).link()
      in order to ASSERT that the linker works — determinism across two runs,
      Bridge A present, unresolved questions carried verbatim, empty organism
      refused.
    why_it_does_not_qualify: >-
      Disabling edge resolution would make these CHECKS fail. A failing check is
      not a function disappearing. Under the four-state counterfactual, STATE B
      would show "the health probe reports unhealthy", not "a runtime function is
      unavailable". That is the difference between the institution noticing a
      problem and the institution losing a capability.
    qualification_criteria_failed:
      - "must change meaningful internal behavior when topology disappears — it does not; only the probe's verdict changes"
      - "must have institutional purpose independent of observing the linker — it does not; observing the linker IS its purpose"

