# SP-2 / SP-3 / SP-4 — institutional anatomy, capability classification, bridges.
#
# The presence classification here is the round's most consequential output. The
# canonical prompt expects a list of missing machinery; the import graph says
# otherwise. Every classification below was produced by executing a static import
# analysis over the kernel at 8cb3074 and by running the institutional linker
# across the committed organ manifests — not by reading READMEs.
#
# Method (reproducible):
#   ast.parse over every package with an __init__.py; count intra-repo imports,
#   reverse-imports, and test references. A package imported by nothing except
#   tests is built-but-unwired regardless of how complete it looks.
#   python -c "... InstitutionalLinker(manifests).link()"  for bridge edges.

nodes:
  # ------------------------------------------------------- the shape of the thing
  - id: anatomy.kernel_is_a_library_not_a_running_system
    kind: finding
    title: The Kernel is a governed component library plus benchmark harnesses — there is no running institution
    evidence_status: verified_by_execution
    measurement:
      python_packages: 22
      total_entrypoints: 3
      entrypoints:
        - "developmental/__main__.py — TARGET_FORM_001 benchmark runner"
        - "evolution/migration/__main__.py — migration experiment runner"
        - "evolution/repair/__main__.py — repair experiment runner"
      servers_or_daemons: 0
      operating_loops: 0
      external_effect_paths_exercised: 0
      ci_jobs: 4
    statement: >-
      There is no server, no daemon, no scheduler and no operating loop anywhere in
      the Kernel. What exists is a well-tested library of institutional components,
      three experiment runners, and four CI guards (full suite + institutional
      verifier, contract $ref resolution, authority singleton, sealed developmental
      work). This is not a criticism — it is the precise reason nothing has ever
      reached reality, and it makes the strategic question tractable.
    consequence: >-
      "Connect the organism" cannot mean wiring more modules to each other. Nothing
      is running to be connected. The missing element is an execution surface that
      carries a real input to a real consequence, not more components.
    refs: [repo.uniimente-kernel, intent.anti_self_deception]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        command: "find . -name __main__.py; ls .github/workflows; ast import analysis over 22 packages"

  - id: anatomy.closure_is_the_integration_hub
    kind: capability
    title: "closure/ is the one real integration hub (imports 18 of 22 packages)"
    evidence_status: verified_by_execution
    presence: existing_and_connected
    lifecycle_role: CANONICAL
    region: BRIDGE
    path: closure/
    files: 8
    imports_packages: 18
    imported_by: [business, egregore, evolution, foundry]
    test_refs: 6
    contents:
      - whole_body.py — the Whole-Body Closure Controller
      - framework.py
      - kernel_registry.py
      - integration_registry.py
      - developmental_registry.py
      - commercial_registry.py
      - advantage_registry.py
    note: >-
      Final Build Order §5.7 lists the Whole-Body Closure Controller as required
      nervous-system machinery. It exists, it is the most connected module in the
      repository, and it carries five registries. This is the single strongest
      counterexample to the "missing machinery" premise.
    refs: [discrepancy.missing_machinery_premise]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        path: closure/
        command: "ast import analysis"

  # --------------------------------------------- built but unwired (the real gap)
  - id: capability.adapters_membrane_orphaned
    kind: capability
    title: "The Universal Compatibility Membrane exists and nothing imports it"
    evidence_status: verified_by_execution
    presence: existing_but_disconnected
    lifecycle_role: EXPERIMENTAL
    region: BRIDGE
    path: adapters/
    files: 4
    imports_packages: 0
    imported_by: []
    test_refs: 4
    contents:
      - bridge_transport.py — third mirror of the organs' transport security, adds the kernel identity
      - daleobanks_opportunity.py — wire→canonical opportunity packet adapter
      - wealthmachine_assessment.py — wire→canonical venture assessment adapter
    statement: >-
      Final Build Order §8 requires the membrane; Phase Zero built its first ring.
      The adapters are real, declare their field mappings and information lost, and
      are exercised by four test references — but zero non-test modules import them.
      The membrane is a shelf of correct parts that no runtime path crosses.
    why_it_matters: >-
      This is the difference between "we have an adapter layer" and "our organs
      translate through an adapter layer". Only the second is a bridge.
    refs: [anatomy.kernel_is_a_library_not_a_running_system]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        path: adapters/
        command: "ast reverse-import analysis: imported_by == 0"

  - id: capability.egregore_runtime_orphaned
    kind: capability
    title: "egregore/ — a runtime, closure, drift and gate adapter that nothing imports"
    evidence_status: verified_by_execution
    presence: existing_but_disconnected
    lifecycle_role: EXPERIMENTAL
    region: RIGHT
    path: egregore/
    files: 7
    imported_by: []
    test_refs: 6
    contents: [closure.py, contracts.py, drift.py, gate_adapter.py, resources.py, runtime.py]
    statement: >-
      The package named for the project's own identity contains a runtime, a gate
      adapter and a drift detector, imports closure/ and policy/, and is imported by
      nothing. It is reachable only from its own tests.
    refs: [anatomy.kernel_is_a_library_not_a_running_system]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        path: egregore/
        command: "ast reverse-import analysis: imported_by == 0"

  - id: capability.morphogenesis_orphaned
    kind: capability
    title: "morphogenesis/ — fully isolated: imports nothing, imported by nothing"
    evidence_status: verified_by_execution
    presence: existing_but_disconnected
    lifecycle_role: EXPERIMENTAL
    region: LEFT
    path: morphogenesis/
    files: 3
    imports_packages: 0
    imported_by: []
    test_refs: 2
    note: >-
      The weakest-attached package in the repository, and a Track B artifact. Its
      isolation is itself evidence for the Track A / Track B decision: the
      morphogenetic line has not earned a connection to the canonical path.
    refs: [intent.track_a_track_b]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        path: morphogenesis/
        command: "ast import analysis: imports 0, imported_by 0, test_refs 2"

  - id: capability.developmental_mica_cdpe
    kind: capability
    title: "developmental/ — MICA and CDPE, reachable only from closure/ and one test"
    evidence_status: verified_by_execution
    presence: existing_but_disconnected
    lifecycle_role: CHALLENGER
    region: LEFT
    path: developmental/
    files: 5
    imported_by: [closure]
    test_refs: 1
    has_entrypoint: "python -m developmental (TARGET_FORM_001 benchmark, run in CI job 4)"
    note: >-
      Track B's flagship. It does run in CI and does emit a benchmark report, which
