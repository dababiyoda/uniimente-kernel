    role: canonical_cross_organ_foundation
    disposition: merged_into_integration
    merge_commit: 56a5339cb2995053d51c8bc0dfcf2fad84b1498b
  - number: 32
    role: commercial_metabolism
    disposition: reconcile_conflicts
    retain:
      - media_foundry
      - business_foundry
      - regenerative_treasury
      - schema_repairs
    must_not_overwrite:
