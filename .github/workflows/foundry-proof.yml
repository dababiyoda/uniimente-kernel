name: Foundry Proof

on:
  push:
    branches:
      - agent/foundry-composer-v0
  pull_request:
    paths:
      - "foundry/**"
      - "tests/unit/test_foundry.py"
      - ".github/workflows/foundry-proof.yml"

permissions:
  contents: read

jobs:
  foundry-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Foundry modules
        run: python -m compileall -q foundry

      - name: Run Foundry acceptance tests
        run: python -m pytest -q tests/unit/test_foundry.py

      - name: Run complete unit suite
        run: python -m pytest -q tests/unit
