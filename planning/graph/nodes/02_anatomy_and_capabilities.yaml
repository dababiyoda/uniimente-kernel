        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        path: developmental/
        command: "ast analysis; .github/workflows/canonical-ci.yml job 4"

  - id: capability.evolution_laboratory
    kind: capability
    title: "evolution/ — 30 modules, 44 test references, the best-covered subsystem"
    evidence_status: verified_by_execution
    presence: existing_and_connected
    lifecycle_role: CHAMPION
    region: BRIDGE
    path: evolution/
    files: 30
    test_refs: 44
    imported_by: [closure]
    contents_of_note:
      - strategy_tree.py — StrategyTree/StrategyBranch with decisive_unknown and coverage()
      - spider_web.py — SpiderWebAudit with sides, mechanism mapping, decorative removal, verdict
      - "repair/ — the frozen-spec repair laboratory (spec.py self-seals via SPEC_SHA256)"
      - migration/ — governed stateful replacement harness
      - experiment.py, capsule.py, comparison.py, failure_analysis.py, branch_generator.py
    statement: >-
      The repair laboratory already implements the hard half of a developmental
      closure: a frozen experiment specification whose canonical JSON is hashed into
      SPEC_SHA256 and guarded by a test, so candidate code cannot silently retune the
      experiment that judges it. That is evaluator sovereignty (Override §12) in
      working code.
    refs: [intent.evaluator_sovereignty, intent.first_developmental_proof]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        path: evolution/repair/spec.py
        symbol: "SPEC_SHA256, REQUIRED_FUNCTION_THRESHOLD, TARGET_CAPABILITY"

  - id: capability.evaluator_firewall_partially_exists
    kind: capability
    title: The protected evaluator firewall is half-built and its existing half is sound
    evidence_status: verified_by_inspection
    presence: existing_but_disconnected
    region: BRIDGE
    what_exists:
      - "evolution/repair/spec.py freezes the experiment and self-seals with SPEC_SHA256"
      - "tests/unit/test_repair_spec_frozen.py fails the build if the hash drifts"
      - "ORIGINAL_LINKER_FILE_SHA256 makes 'preserved unchanged' a checkable claim rather than a promise"
      - "the detector is given the capability NAME and contract, never told which module provides it"
      - "REQUIRED_FUNCTION_THRESHOLD = 1.0 — 3 of 4 is a failure, not a 75% pass"
    what_is_missing:
      - builder/evaluator process isolation (candidates currently run in the same interpreter)
      - candidate writable-path confinement
      - held-out cases the builder cannot read
      - a negative control proving the evaluator itself can fail
      - detection of evaluator mutation at runtime
    statement: >-
      Override §12 says candidate generation is not the scarce primitive; reliable
      judgment is. The frozen-spec mechanism is a genuine, working instance of that
      principle. What it lacks is isolation, not concept.
    refs: [intent.evaluator_sovereignty]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        path: evolution/repair/spec.py

  - id: capability.genuinely_absent
    kind: finding
    title: What is genuinely absent, after classification
    evidence_status: verified_by_execution
    statement: >-
      After classifying all 22 packages by import connectivity, very little of the
      prompt's "expected missing machinery" is actually absent. The genuine gaps are
      narrower and more specific than the brief anticipated.
    genuinely_absent:
      - "an execution surface: any loop, service or scheduled process that carries an input to a consequence"
      - "organ manifests for PumpStation and RESEARCH-IN (2 of 6 organs are invisible to the linker)"
      - "builder/evaluator process isolation and held-out case confinement"
      - "a capability router selecting among competing implementations at runtime"
      - "any external-effect path that has ever been exercised (0 verified outcomes)"
    already_exists_contrary_to_brief:
      - "Whole-Body Closure Controller — closure/whole_body.py, most-connected module"
      - "Capability registry — five registries under closure/"
      - "Universal Compatibility Membrane — adapters/ (built, unwired)"
      - "Institutional Linker — linker/, executable, produces real edge reports"
      - "Institutional compiler — compiler/, imported by closure/evolution/policy"
      - "Mechanism/strategy tooling — evolution/strategy_tree.py, evolution/spider_web.py"
      - "Developmental compiler + candidate builders — evolution/repair/, evolution/migration/"
      - "Protected evaluator — evolution/repair/spec.py frozen-spec mechanism"
      - "OMNIMORPH composition — omnimorph/engine.py, imported by closure and foundry"
      - "Asymmetric Advantage Foundry — foundry/ (12 modules, 20 test refs)"
    refs: [discrepancy.missing_machinery_premise, anatomy.kernel_is_a_library_not_a_running_system]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        command: "ast import analysis across 22 packages; linker edge report; find -name __main__.py"

  # ----------------------------------------------------------------- SP-4 bridges
  - id: bridge.linker_measured_state
    kind: bridge_status
    title: Measured cross-organ edge state from the institutional linker
    evidence_status: verified_by_execution
    typed_edges_resolved: 4
    edges:
      - "daleobanks -> constitutional-controller : wire-opportunity-packet"
      - "daleobanks -> wealthmachine : wire-opportunity-packet"
      - "wealthmachine -> daleobanks : wire-venture-assessment"
      - "wealthmachine -> constitutional-controller : wire-venture-assessment"
    unconsumed_contracts: 11
    unconsumed_of_note:
      - "constitutional-controller produces capability-grant — consumed by no one"
      - "constitutional-controller produces decision — consumed by no one"
      - "constitutional-controller produces evidence — consumed by no one"
      - "constitutional-controller produces outcome — consumed by no one"
      - "constitutional-controller produces event — consumed by no one"
    unproduced_contracts: 1
    untyped_contracts: 0
    unresolved_fields: 7
    overlapping_authority:
      - daleobanks.constitution_service
      - wealthmachine.risk_management
    decisive_reading: >-
      Every contract the Kernel PRODUCES is unconsumed. The organs talk to each
      other over the wire protocol (4 edges, all Bridge A), and nobody consumes a
      kernel-issued grant, decision, evidence record, outcome or event. The linker's
      own unresolved list states it plainly: "peer organs do not yet consume
      kernel-issued grants (Bridges B/C incomplete)".
    consequence: >-
      The Kernel is not currently in the authority path of anything. It is a
      constitutional government whose statutes no organ reads at runtime. Bridge A
      is the only bridge with typed edges; B through H have no edges at all.
    refs: [anatomy.kernel_is_a_library_not_a_running_system]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        command: "InstitutionalLinker(load_manifest(organs/*.manifest.yaml)).link()"

  - id: bridge.two_organs_invisible
    kind: bridge_status
    title: PumpStation and RESEARCH-IN have no organ manifests and are invisible to the linker
    evidence_status: verified_by_execution
    manifests_present: [kernel, daleobanks, wealthmachine]
    manifests_absent: [pumpstation, research-in]
    consequence: >-
      Two of six organs cannot appear in any edge, authority overlap report, or
      capability discovery result. Any claim about whole-system connectivity that
      does not say this is overstating coverage by a third.
    note: >-
      Writing these manifests is runtime work and is NOT authorized this round. The
      round records the gap and specifies the manifests; it does not create them.
    refs: [repo.pumpstation, repo.research-in, intent.research_in_role]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        command: "ls organs/"

  - id: bridge.status_a_through_h
    kind: bridge_status
    title: Bridges A–H — measured status
    evidence_status: verified_by_execution
    A_signal_to_venture:
      status: PARTIALLY_TYPED
      edges: 4
      note: "wire protocol v1.1 typed and registered; adapters exist but are unwired; no episode ever recorded"
    B_venture_to_experiment:
      status: NO_EDGES
      blocker: "no organ consumes capability-grant; Venture Cell charters never requested from kernel authority envelopes"
    C_experiment_to_reality:
      status: NO_EDGES
      blocker: "no external-effect path has ever been exercised; 0 receipts, 0 reconciliations"
    D_reality_to_learning:
      status: NO_EDGES
      blocker: "depends on C; no external observation exists to learn from"
    E_learning_to_evolution:
      status: MACHINERY_PRESENT_NO_INPUT
      note: "evolution/ is the best-covered subsystem (44 test refs) but has no reality input to consume"
    F_audience_to_business:
      status: NO_EDGES
      blocker: "DALEOBANKS has zero published output; no owned audience exists yet"
    G_business_to_capability:
      status: NO_EDGES
      blocker: "depends on F and a completed business workflow"
    H_revenue_to_regeneration:
      status: NO_EDGES
      blocker: "zero revenue"
    summary: >-
      One bridge partially typed, seven with no edges. The chain is blocked at C —
      the first place the institution must touch reality — and everything downstream
      of C is blocked by C rather than by its own difficulty.
    refs: [bridge.linker_measured_state]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        command: "linker edge report + organ manifest inspection"

  - id: authority.overlaps_measured
    kind: authority_conflict
    title: Two organ-local authority implementations, both already flagged
    evidence_status: verified_by_execution
    overlaps:
      - organ: daleobanks
        capability: daleobanks.constitution_service
        disposition: SPECIALIZED beneath kernel authority — preserve, do not promote
      - organ: wealthmachine
        capability: wealthmachine.risk_management
        disposition: SPECIALIZED beneath kernel authority — preserve, do not promote
    third_candidate:
      source: "WMI PR #30 — 'Constitutional Control Layer (Phase 0 doctrine foundation)'"
      head: 14e7bba896e60f31c6dc5885a477ff7e100d64c6
      risk: >-
        Unmerged, so it does not yet appear in the linker's overlap report. If merged
        as written it would create a second constitutional control layer inside a
        non-Kernel organ, which Override §19 forbids. It must land as adapter,
        specialist, test oracle or organ-local control BENEATH kernel authority.
    ci_guard: "scripts/ci/check_authority_singleton.py enforces no second Constitution/Gate/identity/authority registry"
    assessment: >-
      Authority duplication is currently CONTAINED, and the containment is
      mechanical rather than aspirational. The live risk is PR #30, not main.
    refs: [pr.wmi.30, intent.wmi_role]
    evidence_refs:
      - repo: dababiyoda/uniimente-kernel
        sha: 8cb3074a4a837c89aada9bdb5351d7d9b3e4a9c1
        command: "linker overlapping_authority; cat scripts/ci/check_authority_singleton.py"
