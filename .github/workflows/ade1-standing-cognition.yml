# PRESERVED, NOT DELETED — superseded by canonical-ci.yml.
#
# Automatic triggers removed so this cannot double-execute alongside the
# single official workflow. The file is retained as institutional memory
# and remains runnable on demand (Actions -> Run workflow).
# UNIIMENTE_FINAL_BUILD_ORDER Sections 2 and 12 forbid deleting it.
#
name: ADE-1 standing cognition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        # Read from requirements-dev.txt rather than listing packages here. This
        # step hand-listed pytest/pyyaml/jsonschema and then ran the whole unit
        # suite, so any new test dependency broke it while the other workflows
        # stayed green — a drift that reports as a test failure and reads as a
        # regression. One source of truth removes the class of problem.
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run ADE-1 adversarial tests
        run: python -m pytest tests/unit/test_egregore_runtime.py -q

      - name: Run full unit suite
        run: python -m pytest tests/unit -q

      - name: Run institutional verifier
        run: python verifier/v2/verify.py
