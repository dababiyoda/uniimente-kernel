    evidence_status: verified_by_inspection
    decision: AUTHORIZE_STAGED_PROGRESSION
    not_authorized: unrestricted live publishing
    not_acceptable: permanent shadow mode
    principle: >-
      Not "approve every post" — "approve the operating territory once."
    stages:
      stage_1_shadow:
        permitted: [research, draft, fact-check, localize, simulate schedule, predict reception, record decisions]
        publication: NONE
      stage_2_canary:
        permitted: [one approved account, approved low-risk content classes, small daily volume]
        prohibited: [private messages, spending, account-setting changes, regulated personalized advice]
        safety: automatic disarm on integrity failure
        gate: >-
          A tested Standing Authority Covenant, rollback, tamper-evident decision
          record, and platform-specific policy checks.
      stage_3_bounded_standing_authority:
        permitted: [multiple approved accounts and languages, ordinary posts execute automatically]
        escalation: exceptions escalate
    consequence_for_this_round: >-
      Node 4 (first economic closure) moves from BLOCKED_ON_FOUNDER to GATED — the
      blocker is now a buildable covenant rather than an unmade decision. Economic
      closure proceeds in parallel rather than being deferred indefinitely.
