name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: python -m pytest tests/unit -q > unit-test.log 2>&1

      - name: Upload unit-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-unit-test-log
          path: unit-test.log
          if-no-files-found: error

      - name: Report unit-test failure
        if: steps.unit_tests.outcome == 'failure'
        run: |
          tail -n 250 unit-test.log
          exit 1

      - name: Run institutional verifier
        if: steps.unit_tests.outcome == 'success'
        run: python verifier/v2/verify.py
