  - id: pr66.disposition_dossier
    kind: pr_disposition
    title: "PR #66 disposition — FREEZE AS TRACK B RESEARCH"
    evidence_status: derived
    disposition: FREEZE_AS_TRACK_B_RESEARCH
    what_it_proves: >-
      That pre-arrival control, sender-owned ingress, causal need closure and
      author-direction classification can be built and adversarially verified;
      and — more valuable — that five plausible designs for decoupling canonical
      from legacy repair are wrong, each falsified by measurement rather than by
      argument.
    what_it_does_not_prove: >-
      Anything about the comparison it exists to settle. Its own body says so:
      the work establishes correctness prerequisites and measurement integrity,
      not evidence that the morphogenetic substrate beats a conventional durable
      workflow engine. Only R8 decides that, and R8 is prohibited until a freeze
      that has receded repeatedly.
    mechanisms_to_promote_to_capability_candidates:
      - pre-arrival control (bounded pending-control mechanism with fail-closed authentication)
      - causal need closure (NC-3 obligation-generation predicate)
      - the instrument-liveness discipline itself — arguably the most transferable output
    tests_to_promote_to_protected_evaluators:
      - the 24 strict xfail specifications as a regression corpus
      - adopted_edge_return_negative_control.py
      - prearrival_adversarial_twin.py
    artifacts_historical_only:
      - the five falsified design comparisons (retain as counterfactual evidence)
      - two withdrawn audits (retain — a withdrawn audit is evidence about auditing)
    needs_bounded_completion_milestone: false
    milestone_rationale: >-
      A bounded milestone was considered and rejected. The natural candidate is
      "land the DUAL_REPAIR_SEARCHES detector reordering with its negative
      control", which is small and correct. But it does not change the branch's
      standing, does not move Gate F or G, and reopens a runtime workstream this
      round has just decided to freeze. Record it as the first task if the branch
      is ever resumed, not as a reason to keep it warm.
    evidence_that_would_justify_resuming: >-
      A measured result showing the morphogenetic substrate beating the
      conventional baseline on an equivalent task, or a decision to run R8.
    evidence_that_would_kill_the_mechanism_as_default: >-
      A sixth falsified design in the B/C/D/F family, which would make it likely
      that the underlying lifecycle model — not the individual designs — is wrong.
    preservation: >-
      Nothing deleted. Branch retained, PR left open and draft, all 133 commits
      and 240 files preserved with lineage. Freezing is a routing decision, not a
      removal.
    refs: [pr66.state_capsule, pr.kernel.66.dissent, route.01_pr66_first, decision.final]

