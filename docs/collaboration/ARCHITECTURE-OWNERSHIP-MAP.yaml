        qualnames: [EVIDENCE_TIERS]
        evidence:
          - "audit() refuses a Foundry row whose evidence_tier is not in it; `greg foundry status|run` (greg/cli.py) imports the module, but only audit() reads the tuple"
      - side: B
        module: acceptance
