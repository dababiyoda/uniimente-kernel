name: Canonical CI

# The single official workflow for the canonical line.
#
# EXACTLY ONE RUN PER CHANGE. `pull_request` validates every proposed change;
# `push` fires only on `main`, after merge. A branch with an open PR therefore
# produces one run, not two. `workflow_dispatch` exists so an unchanged commit
# can be re-run in a clean environment for release evidence.
#
# The first four jobs are the required Package 1 checks. A fifth verifies
# the research assembly against pinned real consumer source checkouts. A sixth
# runs the Polyintelligence Cortex seed with its solver dependency and replays
# the frozen held-out evaluation (it refuses if any frozen input changed).
# An eighth runs one founder-signed mission through the whole machine across processes
# (Mind, Genesis, the real DALEOBANKS and WealthMachine code, a worker, SIGKILL and founder
# reconciliation, independent re-derivation) with its hostile cases, and never skips.
# A ninth runs the institutional verifier V1-V5 beside job 1 instead of after it.
# An eleventh installs Python Playwright and its Chromium and runs the browser tests with
# GREG_REQUIRE_BROWSER=1, so a missing browser fails instead of reading as skipped.
# The two pre-existing workflows (tests.yml, ade1-standing-cognition.yml) are
# preserved but reduced to manual dispatch so they cannot double-execute.
# They are not deleted: UNIIMENTE_FINAL_BUILD_ORDER §2 and §12 forbid
# destructive simplification.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]          # a tag is a release candidate: the release-exclusion check must run on it
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: "1 · Kernel and organ tests"
    runs-on: ubuntu-latest
    # The limit bounds a hung run; it is not a speed target. Verifier V2 now runs once, in job 9 (44f7c35); this
    # job still carries the full suite, the worker-isolation regressions and the mutation checks. Hosted runners
    # differ in speed: on 2026-10-15 the suite took 11 min on one (a48e8fa) and 17.5 min on another (349e732), and
    # whole jobs took 34.5 and 38.5 min on slow runners (#178). On the Track B line, where the suite still ran
    # twice here, it took about 15 + 12 minutes at c360103, and at 0067be6 the full suite alone took 25 minutes
    # (the V2 re-run was then cancelled 20 minutes in at the 45-minute limit, run 39614663399): growth from the
    # review rounds' regression tests, not a hang (#180). This job now carries both lineages' tests, so it keeps
    # the larger of the two limits. On the joined tree (#196) the job took 65 minutes at 78da0332; #158's admission v8
    # (83 genomes) adds its tests, and on its own line the full suite alone took 38 minutes at 14608914. Raised to 90.
    # ubuntu-latest then moved to a runner where bubblewrap namespaces work, so the confined tests that used to skip
    # now run: the full suite took 86 minutes at dacf6975 and fa80ace7 (7795 passed at fa80ace7, run 39984114068), and
    # the job was cancelled at 90 during the mutation steps that follow it. Raised to 120. The mutation steps now run
    # in job 10 (mutation_gates), in parallel.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Frozen compatibility tests verify the original source, not a new seal.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt -r requirements-cognition.txt
      - name: Measure actual host isolation facilities
        run: python scripts/ci/probe_isolation.py
      - name: OS filesystem confinement and escape regression checks
        env:
          GREG_REQUIRE_LANDLOCK: "1"
        run: python -m pytest -q tests/unit/test_greg_landlock.py tests/unit/test_greg_mcp_worker.py
      - name: Native company runtime regression checks
        run: python -m pytest -q tests/unit/test_greg_owned_company.py
      - name: Provision worker namespace isolation (bubblewrap) and report whether this runner can use it
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          if bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent --ro-bind / / -- /usr/bin/true; then
            echo "bubblewrap namespaces: usable"
          else
            echo "bubblewrap namespaces: NOT usable on this runner; real-isolation tests skip and say why"
          fi
      - name: Worker confinement, acceptance and collector escape regressions (skip reasons shown)
        run: python -m pytest -q -rs tests/unit/test_greg_worker_isolation.py tests/unit/test_greg_workers.py
      - name: Release exclusions (uncleared third-party data never ships)
        run: python scripts/check_release_exclusions.py
      - name: Release exclusions on a tag's source archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git archive --format=tar --prefix=release/ HEAD > "$RUNNER_TEMP/release.tar"
          python scripts/check_release_exclusions.py --archive "$RUNNER_TEMP/release.tar"
      - name: Full unit and integration suite
        run: python -m pytest -q
      - name: Frozen cognition assessment
        run: |
          python -m greg.cognition.benchmark > cognition-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-cognition-report
          path: cognition-report.json
          if-no-files-found: error
          retention-days: 90
  mutation_gates:
    name: "10 · Mutation gates (A)"
    runs-on: ubuntu-latest
    # Each gate removes one safeguard in a scratch copy and requires a failing test. They need none of job 1's
    # results, so they run here in parallel with it. In job 1, after the full suite, they had pushed the job past its
    # 120-minute limit on the joined tree: cancelled twice on #274's 68b772cb with no test failed (10571 and 10572
    # passed; the gates after the suite took about 24 minutes), and 99 minutes on #196's 75a8fdf4. The limit bounds a
    # hung run, not a speed target.
    # By 2026-11-12 the gates alone had reached the 90-minute limit set here: on three heads based on 8d205324 this
    # job took 79 min 49 s (#294, 1643932e), 85 min 6 s (#293, 32ca8de7) and 89 min 59 s (#298, b9a34259), and it was
    # cancelled at 90 minutes with every mutant so far caught on two heads that add one more gate (#300, 0aa09c87;
    # the composed candidate #299, eebd3b46). A cancelled gate job is not a passed one. The limit is doubled; running
    # the gates as parallel shards would shorten the job instead and is the integrator's and the founder's choice.
    # Split in two on 2026-11-13: run one at a time, the gates outgrew 180 minutes once the convergence intake
    # (8c0f502a) added 14 of them; that head's job 10 was cancelled at the limit with every gate so far passing. Job
    # 10b runs the other half on its own runner, so both run in parallel and every gate still runs, unchanged.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt -r requirements-cognition.txt
      - name: Provision worker namespace isolation (bubblewrap), as job 1 does
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          if bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent --ro-bind / / -- /usr/bin/true; then
            echo "bubblewrap namespaces: usable"
          else
            echo "bubblewrap namespaces: NOT usable on this runner; real-isolation tests skip and say why"
          fi
      - name: Typed handoff authority, scope and type mutations
        run: python scripts/ci/check_pipeline_mutants.py
      - name: Native source-bound appraisal and workload mutations
        run: python scripts/ci/check_native_cognition_mutants.py
      - name: Enclosing cognition budget and verification reserve mutations
        run: python scripts/ci/check_cognition_budget_mutants.py
      - name: Fork-safe commodity WASM compiler lifecycle mutation
        run: python scripts/ci/check_wasm_lifecycle_mutant.py
      - name: Canonical WorkOrder and reobservation mutations
        run: python scripts/ci/check_worker_appraisal_mutants.py
      - name: Appraiser attach-state mutations (the separate appraiser runs nothing for a capability that is not ATTACHED)
        run: python scripts/ci/check_appraiser_attach_state_mutants.py
      - name: Whole-output judgment mutations (a check decided over the output its receipt kept, never on what it could not measure)
        run: python scripts/ci/check_whole_output_mutants.py
      - name: Founder-device acceptance tier and live-runtime mutations
        run: python scripts/ci/check_acceptance_mutants.py
      - name: Consistent backup mutations
        run: python scripts/ci/check_consistent_backup_mutants.py
      - name: Cathedral detector mutations (activity rising while founder-tier outcomes do not)
        run: python scripts/ci/check_cathedral_detector_mutants.py
      - name: Effect-call allowlist mutations (every process or connection GREG's code opens is listed)
        run: python scripts/ci/check_effect_call_allowlist_mutants.py
      - name: Retained-receipt mutations (a retained Gate receipt is read by its result, as the call that produced it read it)
        run: python scripts/ci/check_retained_receipt_mutants.py

  mutation_gates_b:
    name: "10b · Mutation gates (B)"
    runs-on: ubuntu-latest
    # The second half of job 10's gates; see the note there.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt -r requirements-cognition.txt
      - name: Provision worker namespace isolation (bubblewrap), as job 1 does
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          if bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent --ro-bind / / -- /usr/bin/true; then
            echo "bubblewrap namespaces: usable"
          else
            echo "bubblewrap namespaces: NOT usable on this runner; real-isolation tests skip and say why"
          fi
      - name: Standing-approval regression mutations (a failed run under a standing approval withdraws it)
        run: python scripts/ci/check_standing_approval_regression_mutants.py
      - name: Capability disposition mutations (RETAIN, REPAIR, REGRESS or REMOVE proposed after outcomes, never applied)
        run: python scripts/ci/check_capability_disposition_mutants.py
      - name: Path predicates and build frontier mutations
        run: python scripts/ci/check_path_predicate_mutants.py
      - name: Typed blocker mutations (each open blocker names why, what lifts it and who must act)
        run: python scripts/ci/check_typed_blockers_mutants.py
      - name: Compute closure mutations (a lasting bottleneck is asked again; memory and IO measured; changes verified)
        run: python scripts/ci/check_compute_closure_mutants.py
      - name: Emergence gate mutations (a construction that does not beat its runnable baseline is refused as integration)
        run: python scripts/ci/check_emergence_gate_mutants.py
      - name: Ask-terms mutations (every ask shows its authority, what approving covers and what silence does)
        run: python scripts/ci/check_ask_terms_mutants.py
      - name: Canonical-owner registry mutations (one owner per duplicated function, guarded)
        run: python scripts/ci/check_canonical_owner_guard_mutants.py
      - name: Node revocation and enrolled-node receipt mutations (NODE_REVOKE founder-only, receipts admitted only inside the node's cone)
        run: python scripts/ci/check_node_revoke_mutants.py
      - name: Authority attach-state mutations (the office refuses a capability the founder has not left ATTACHED)
        run: python scripts/ci/check_authority_attach_state_mutants.py
      - name: Authority registered-identity mutations (the office runs a capability's own registered adapter only)
        run: python scripts/ci/check_authority_registered_identity_mutants.py
      - name: Revoked-device mutations (a revoked device's unused approval authorizes nothing; completed effects and history stay; a suspected compromise opens a review)
        run: python scripts/ci/check_revoked_device_mutants.py
      - name: Signed autonomy issuance mutations (autonomy above A0 only on the founder's signed AUTONOMY_GRANT for that exact tuple and level; a name alone issues nothing)
        run: python scripts/ci/check_autonomy_signed_issuance_mutants.py
      - name: Functional reconstitution mutations (a lost function returns by another mechanism; a completed write is not repeated; a founder detach stands)
        run: python scripts/ci/check_reconstitution_mutants.py
      - name: Unmeasured-check mutations (a check a faulted capability could not read is never pursued, never retried unseen, and blames no strategy)
        run: python scripts/ci/check_unmeasured_check_mutants.py
      - name: Browser binary mutations (an unconfined render uses an installed browser only after it rendered a local page; behind the relay no browser starts outside the namespace; GREG_CHROMIUM is the only browser run, or is refused by name)
        run: python scripts/ci/check_browser_binary_mutants.py
      - name: Composition rehearsal mutations (a test that passes alone and fails merged is reported with its cause; nothing is merged)
        run: python scripts/ci/check_compose_rehearsal_mutants.py

  verifier:
    # Its V2 re-runs tests/unit, so inside job 1 it pushed that job past its 30 minutes once the
    # suite grew (the base 0ae4c94 times out there too). It reads nothing job 1 produces.
    name: "9 · Institutional verifier V1-V5"
    runs-on: ubuntu-latest
    # Same rationale as job 1 (#180): V2 re-runs tests/unit, which Track B's Mind tests enlarged; bounds a hung run.
    # On the joined tree (#196) V2 covers both lineages' tests/unit: 25 min in #192's job 9, 29m10s inside Track B's
    # job 1; 60 kept that union clear until the joined suite reached 59 min (2026-10-22, 58a2fad1) and was cancelled at
    # 60 on 40ce615d. 120 matches job 1, which runs the same tests/unit (70 minutes here at fa80ace7).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # V2 runs the frozen compatibility tests, which verify the original source.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt -r requirements-cognition.txt
      - name: Institutional verifier V1-V5
        run: python verifier/v2/verify.py

  owned_oci:
    name: "7 · Owned OCI capability rebuild and execution"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt -r requirements-cognition.txt
      - name: Build immutable owned capability twice and run second environment
        run: python scripts/ci/prove_oci.py oci-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-oci-capability-evidence
          path: oci-evidence/
          if-no-files-found: error
          retention-days: 30

  contracts:
    name: "2 · Contract schema references resolve"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Every document-local $ref resolves across contracts/**
        run: python scripts/ci/check_schema_refs.py

  authority:
    name: "3 · One source of authority"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The integrity check reads every committed version of its record files:
          # a genesis key never changes and no signed record is removed.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No second Constitution, Gate, identity or authority registry
        run: python scripts/ci/check_authority_singleton.py
      - run: pip install "cryptography>=41"
      - name: Live constitutional integrity (CONTRADICTION-0002 Option A; only founder-signed authorizations count)
        # Fails, naming each artifact and the founder's exact steps, when a protected
        # artifact differs from what an enrolled founder key authorized.
        run: python -m governance.integrity --check

  sealed:
    name: "4 · Developmental work stays sealed"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Zero external effects, no self-granted authority
        run: python scripts/ci/check_sealed_developmental.py
      - name: TARGET_FORM_001 benchmark evidence
        run: python -m developmental > target_form_001_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: target-form-001-report
          path: target_form_001_report.json
          if-no-files-found: error
          retention-days: 90

  cortex_seed:
    name: "6 · Cortex seed experiment (Z3 + CP-SAT, frozen evaluation)"
    runs-on: ubuntu-latest
    # 150 mutants run in parallel, one repository copy per core (about 11 minutes on 4 cores, #194).
    # The joined tree (#196) runs both lineages' mutants: the whole job took 18m04s at 47229e3b (#192, run 39645058690)
    # and 15.5 min at af50537b (#196 before Track B); Track B's residual step alone took 6m04s at 93badaff (run
    # 39688750571) and now runs the union plus #192's baseline pass. #201's metabolism group outgrew 40: the job took
    # 37.5 min at a1d2abf (run 39969265532, mutation step 21m35s) and was cancelled at 40 on b02b3d40 (run 41023976986)
    # with every step passing (mutation 25m05s, residual 11m55s), one step from the end. 60 bounds a hung run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # requirements-cognition adds NetworkX and SciPy: the open-source engines genesis qualifies.
      - run: pip install -r requirements-dev.txt -r requirements-cortex.txt -r requirements-cognition.txt
      # pdftotext (poppler-utils) is the system binary document.text acquires (#201). Without it the document tests
      # skip and their mutants survive (run 39729783774), so it is provisioned and then required, never skipped.
      - name: Provision poppler-utils (the acquired document reader)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Cortex tests with the solvers and open-source engines present (no skips)
        env:
          GREG_REQUIRE_PDFTOTEXT: "1"
        run: python -m pytest -q tests/unit/test_cortex_gates_genome.py tests/unit/test_cortex_routes.py tests/unit/test_cortex_pipeline.py tests/unit/test_cortex_traceability.py tests/unit/test_cortex_register.py tests/unit/test_cortex_formal_engines.py tests/unit/test_cortex_schedule_composition.py tests/unit/test_cortex_crossgeo.py tests/unit/test_greg_cortex_bridge.py tests/integration/test_greg_cortex_mission.py tests/unit/test_greg_open_source_genesis.py tests/unit/test_greg_document_text.py tests/unit/test_greg_license_qualification.py
      - name: Mutation check (every safeguard-removing mutant must be caught)
        env:
          GREG_REQUIRE_PDFTOTEXT: "1"
        run: python scripts/ci/check_cortex_mutants.py
      - name: Canonical GREG seed-path cognition, signed authority and process recovery
        run: python -m pytest -q tests/unit/test_greg_cognition_seed_path.py tests/unit/test_greg_seed_compat.py tests/integration/test_greg_cognition_process.py
      - name: GREG cognition boundary mutation check
        run: python scripts/ci/check_greg_cognition_mutants.py
      - name: Residual safeguards (cross-engine certificates, legitimacy, disclosure packages, characterization, thinking budget, venture and media cases, the Task Fabric evaluator, restore from a tested backup, failure closures) and their mutation check
        run: |
          python -m pytest -q tests/unit/test_cognition_residual_safeguards.py tests/unit/test_cognition_disclosure.py tests/unit/test_cognition_characterize.py tests/unit/test_cognition_thinking_budget.py tests/unit/test_greg_ventures.py tests/unit/test_greg_media_case.py tests/unit/test_greg_task_fabric.py tests/unit/test_greg_restore.py tests/unit/test_greg_failure_closure.py
          python scripts/ci/check_cognition_residual_mutants.py
      - name: Seed Genome 120-case frozen engineering comparison
        run: python -m cortex.evaluation.seed_genome.run --out seed-genome-results.json
      - name: Migrated seed compatibility against original sealed cases
        run: python scripts/ci/replay_seed_compatibility.py --out seed-compat-replay.json
      - name: Held-out run against the freeze manifest (refuses if frozen inputs changed)
        run: python -m cortex.evaluation.run --partition heldout --out cortex-heldout-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-heldout-results
          path: |
            cortex-heldout-results.json
            seed-genome-results.json
          retention-days: 30

  research_line:
    name: "5 · Connected open-source research assembly"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: kernel
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dababiyoda/WealthMachineIntelligence
          ref: 0e80582d6d4f5b4d2477e13d2bb48fb4a57be3e6
          path: consumers/wmi
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dababiyoda/DALEOBANKS
          ref: 664ac98c553759ce754bb684cb248225343edd7e
          path: consumers/dale
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local compute dependencies
        run: python -m pip install -r kernel/requirements-research-line.txt pytest
      - name: Verify workflow controls and real consumer composition
        working-directory: kernel
        env:
          WMI_SOURCE: "${{ github.workspace }}/consumers/wmi"
          DALEOBANKS_SOURCE: "${{ github.workspace }}/consumers/dale"
        run: python -m pytest -q tests/unit/test_research_line.py -k "real_consumer or local_report"
      - name: Produce reviewable offline assembly output
        working-directory: kernel
        run: >-
          python -m foundry.research_line --mode preview
          --job examples/research-line/job.json
          --wmi-source ../consumers/wmi --dale-source ../consumers/dale
          --fixture-results examples/research-line/search-fixture.json
          --template-analysis --out ../research-preview.json
      - name: Upload synthetic preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-line-synthetic-preview
          path: research-preview.json
          retention-days: 14

  one_machine:
    name: "8 · One machine: a signed mission across Mind, Genesis, organs, Hands, interruption and independent appraisal"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 0
          persist-credentials: false
      # The organs at their upgraded pins (founder decision 2026-10-23): per-organ bridge keys, and DALEOBANKS
      # packets that carry stated evidence. Draft PRs DALEOBANKS #96 and WealthMachineIntelligence #47 (on #45, on
      # #44): WealthMachine reads the staffing figures it is sent (step 9, test_organ_staffing_figures.py).
      # test_combined_construction_outcome.py (#210 with #212) needs the same organs, so it runs here too.
      - uses: actions/checkout@v4
        with:
          repository: dababiyoda/DALEOBANKS
          ref: 664ac98c553759ce754bb684cb248225343edd7e
          path: organs/daleobanks
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dababiyoda/WealthMachineIntelligence
          ref: 0e80582d6d4f5b4d2477e13d2bb48fb4a57be3e6
          path: organs/wealthmachine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kernel environment
        # organs.exchange runs organ code under the kernel's own interpreter, as the research line does, so it needs
        # the research line's pinned organ imports (python-dotenv). Until ubuntu-26.04 the ten-step proof that
        # exercises it was skipped for want of bubblewrap namespaces. Playwright (job 11's pin) drives the proof's step 9.
        run: pip install -r kernel/requirements-dev.txt -r kernel/requirements-cognition.txt -r kernel/requirements-research-line.txt playwright==1.63.0
      - name: Each organ in its own environment, from its own requirements
        run: |
          python -m venv organs/daleobanks-venv
          organs/daleobanks-venv/bin/pip install -q -r organs/daleobanks/requirements.txt
          python -m venv organs/wealthmachine-venv
          organs/wealthmachine-venv/bin/pip install -q -r organs/wealthmachine/requirements.txt
      - name: Provision worker namespace isolation (bubblewrap) for the ten-step proof's Hands step
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          if bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent --ro-bind / / -- /usr/bin/true; then
            echo "bubblewrap namespaces: usable"
          else
            echo "bubblewrap namespaces: NOT usable on this runner; the ten-step proof skips and says why"
          fi
      # Without a browser the ten-step proof recorded step 9 (Mission Control at three widths) as NOT_RUN and passed.
      - name: Install Playwright's Chromium for the ten-step proof's step 9, as job 11 does
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers"
          python -m playwright install --with-deps chromium
          shell=$(ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell | tail -n 1)
          test -x "$shell"
          "$shell" --version
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          echo "GREG_CHROMIUM=$shell" >> "$GITHUB_ENV"
      # GREG asks for Chromium's own sandbox when it does not run as root (greg/computer.py). On this runner the
      # first run of job 11 (106a8eb8) failed 6 tests with "No usable sandbox": Ubuntu's AppArmor restricts
      # unprivileged user namespaces for binaries without a profile. This lets the test machine provide them; it
      # does not change what GREG asks for.
      - name: Let Chromium create its own sandbox on this runner, as job 11 does
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Whole-machine mission, organ capabilities and hostile cases (organs required, no skips)
        working-directory: kernel
        env:
          UNIIMENTE_REQUIRE_ORGANS: "1"
          GREG_REQUIRE_LANDLOCK: "1"
          GREG_REQUIRE_BROWSER: "1"
          UNIIMENTE_DALEOBANKS_ROOT: "${{ github.workspace }}/organs/daleobanks"
          UNIIMENTE_DALEOBANKS_PYTHON: "${{ github.workspace }}/organs/daleobanks-venv/bin/python"
          UNIIMENTE_WEALTHMACHINE_ROOT: "${{ github.workspace }}/organs/wealthmachine"
          UNIIMENTE_WEALTHMACHINE_PYTHON: "${{ github.workspace }}/organs/wealthmachine-venv/bin/python"
          UNIIMENTE_ONE_MACHINE_EVIDENCE: "${{ github.workspace }}/one-machine-evidence"
          # The ten-step proof uses the real organ checkouts only when these name them (else stand-ins).
          GREG_TEST_DALEOBANKS: "${{ github.workspace }}/organs/daleobanks"
          GREG_TEST_WMI: "${{ github.workspace }}/organs/wealthmachine"
          GREG_ONE_MACHINE_EVIDENCE: "${{ github.workspace }}/one-machine-evidence/ten-steps"
          GREG_LOOP15_EVIDENCE: "${{ github.workspace }}/one-machine-evidence/loop15"
          # test_cross_organ_mission.py reads the same checkouts under these names
          UNIIMENTE_DALEOBANKS_DIR: "${{ github.workspace }}/organs/daleobanks"
          UNIIMENTE_WEALTHMACHINE_DIR: "${{ github.workspace }}/organs/wealthmachine"
        run: |
          test -x "$GREG_CHROMIUM" || { echo "::error::GREG_CHROMIUM does not name the browser installed above: '$GREG_CHROMIUM'"; exit 1; }
          python -m pytest -q -rs tests/integration/test_one_machine.py tests/integration/test_one_machine_ten_steps.py tests/integration/test_one_mission_fifteen_steps.py tests/integration/test_organ_staffing_figures.py tests/integration/test_combined_construction_outcome.py tests/integration/test_one_machine_attacks.py tests/unit/test_greg_organs.py tests/unit/test_greg_organ_exchange_verdict.py tests/unit/test_greg_organ_bridge.py tests/unit/test_greg_daleobanks_bridge.py tests/unit/test_greg_bind_from_check.py tests/unit/test_greg_model_identity_policy.py tests/unit/test_greg_organ_exchange.py::test_real_organs tests/unit/test_greg_media_case.py::test_real_daleobanks_consumes_the_minds_receipts tests/unit/test_greg_task_fabric.py::test_on_the_real_daleobanks_its_own_checks_pass_a_distorted_draft_and_the_mind_holds_it_back tests/unit/test_cross_organ_mission.py::test_full_three_process_mission --junitxml="$RUNNER_TEMP/job8.xml"
      - name: Count job 8's skips (it says it never skips; pytest exits 0 on a skip, so the count is reported)
        if: always()
        run: >-
          python -c 'import sys, xml.etree.ElementTree as E;
          n = sum(int(t.get("skipped", 0)) for t in E.parse(sys.argv[1]).getroot().iter("testsuite"));
          print("job 8 skipped:", n);
          print("::warning::job 8 skipped %d test(s); see the -rs summary above" % n) if n else None'
          "$RUNNER_TEMP/job8.xml"
      - name: Organ-exchange verdict mutations (the live mutant needs the organs, so it runs here)
        working-directory: kernel
        env:
          UNIIMENTE_REQUIRE_ORGANS: "1"
          UNIIMENTE_DALEOBANKS_ROOT: "${{ github.workspace }}/organs/daleobanks"
          UNIIMENTE_DALEOBANKS_PYTHON: "${{ github.workspace }}/organs/daleobanks-venv/bin/python"
          UNIIMENTE_WEALTHMACHINE_ROOT: "${{ github.workspace }}/organs/wealthmachine"
          UNIIMENTE_WEALTHMACHINE_PYTHON: "${{ github.workspace }}/organs/wealthmachine-venv/bin/python"
        run: python scripts/ci/check_organ_verdict_mutants.py
      # Runs here, not in job 1: job 1 already takes about its whole 120-minute limit on the base (#221, #260), and
      # this 41-mutant gate (about 1.5 minutes) needs only the kernel environment this job installs.
      - name: Evidence-correction mutations (a changed, retracted, expired or contradicted reading marks what rests on it)
        working-directory: kernel
        run: python scripts/ci/check_evidence_corrections_mutants.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-machine-evidence
          path: one-machine-evidence/
          if-no-files-found: warn
          retention-days: 30

  browser:
    name: "11 · Browser tests in a real Chromium (Playwright and its browser required, never skipped)"
    runs-on: ubuntu-latest
    # Until 2026-11-12 no job installed Python Playwright or a browser, so browser.session (greg/computer.py), Mission
    # Control and the phone page in Chromium, and browser.render behind the relay skipped on every change ("could not
    # import 'playwright'"), and the phone test had stopped matching the decision record (e166308c) unseen.
    # GREG_REQUIRE_BROWSER=1 turns a missing or unrunnable browser into a failure (tests/browser_requirement.py).
    # These modules took about 4 minutes in a container; the limit bounds a hung run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Cognition: the First Mission that Mission Control drives selects with cognition.dp_knapsack (numpy).
      # Playwright: the pin directive-completion.yml installs; its browser build is fetched below.
      - run: pip install -r requirements-dev.txt -r requirements-cognition.txt playwright==1.63.0
      # GREG_CHROMIUM is Playwright's Chrome Headless Shell. In a container, full Chrome for Testing 153's one-shot
      # `--headless=new --dump-dom` (browser.render) loaded the page and never printed it or exited, while the
      # headless shell, Playwright's own default for headless launches, rendered at once; Playwright drives either.
      - name: Install Playwright's Chromium and its system libraries; name the binary every browser test drives
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers"
          python -m playwright install --with-deps chromium
          shell=$(ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell | tail -n 1)
          test -x "$shell"
          "$shell" --version
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          echo "GREG_CHROMIUM=$shell" >> "$GITHUB_ENV"
      # GREG asks for Chromium's own sandbox when it does not run as root (greg/computer.py). On this runner the
      # first run of job 11 (106a8eb8) failed 6 tests with "No usable sandbox": Ubuntu's AppArmor restricts
      # unprivileged user namespaces for binaries without a profile. This lets the test machine provide them; it
      # does not change what GREG asks for.
      - name: Let Chromium create its own sandbox on this runner (unprivileged user namespaces)
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Provision bubblewrap for the confined browser (#26 relay), as job 1 does
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          if bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent --ro-bind / / -- /usr/bin/true; then
            echo "bubblewrap namespaces: usable"
          else
            echo "bubblewrap namespaces: NOT usable on this runner; the confined browser tests skip and say why"
          fi
      - name: Browser tests (a missing or unrunnable browser fails; other skips are listed)
        env:
          GREG_REQUIRE_BROWSER: "1"
        run: |
          test -x "$GREG_CHROMIUM" || { echo "::error::GREG_CHROMIUM does not name the browser installed above: '$GREG_CHROMIUM'"; exit 1; }
          python -m pytest -q -rs tests/unit/test_greg_computer.py tests/unit/test_greg_browser.py tests/integration/test_greg_mission_control_browser.py tests/integration/test_greg_phone_asks.py tests/integration/test_greg_phone_e2e.py tests/integration/test_greg_confined_egress.py tests/integration/test_greg_mcp_token.py
