  - id: route.10_do_nothing
    kind: strategy_branch
    title: "R10 — Minimal maintenance / wait for better models"
    evidence_status: derived
    causal_mechanism: "Hold position; let frontier capability improve; spend nothing."
    genuine_merits: >-
      Costs nothing, risks nothing, destroys nothing, and the 69-PR backlog would
      stop growing. If the institution's real constraint is founder attention rather
      than engineering capability, this dominates every build route.
    strongest_counterexample: >-
      Zero external outcomes is already the status quo after months of work. Waiting
      produces a larger unlanded backlog and an older stale-base problem, and every
      calibration constant stays uncalibrated. Model improvement does not close a
      bridge that no process is running.
    hard_gate_result: PASSES
    score: 2
    disposition: REJECTED_BUT_RECORDED
    role: "Retained as the mandatory do-nothing baseline every other route must beat."
    refs: [decision.controlling_fact, discrepancy.stacked_pr_backlog]

  - id: route.11_execution_surface_first
    kind: strategy_branch
    title: "R11 — DISCOVERED: build the execution surface, not more components"
    evidence_status: derived
    origin: "Not in the prompt's list. Generated from the measured absence of any entrypoint."
    causal_mechanism: >-
      The measured gap is not components but a process that runs. Build the smallest
      possible governed execution surface — one loop that takes a real input, crosses
      the Consequence Gate, produces a receipt and reconciles — and let existing
      components attach to it.
    strongest_counterexample: >-
      Without a real external target, the "execution surface" is a loop over
      fixtures, which is a test harness with a grander name. It collapses into R3
      unless it has a genuine consequence to carry, and R4/R5 (which supply real
      consequences) are both blocked on founder authority.
    hard_gate_result: PASSES
    score: 6
    disposition: MERGED_INTO_PRIMARY
    merge_note: >-
      Its true content — "prefer the thing that executes over the thing that is
      merely well-formed" — is adopted as a constraint on R3 rather than as a
      separate route: the developmental closure must run as an actual process with a
      recorded run, not as a passing test.
    refs: [anatomy.kernel_is_a_library_not_a_running_system]

  - id: route.12_portfolio
    kind: strategy_branch
    title: "R12 — Staged portfolio with unequal tracks (RECOMBINED)"
    evidence_status: derived
    construction: "R3 primary, constrained by R11, supported by R2, with R5 held as the first route to unblock."
    causal_mechanism: >-
      Run one unblocked engineering bottleneck to a real 0→1 proof while the
      founder-blocked commercial route waits on a decision only the founder can make.
      Neither waits for the other.
    why_a_portfolio_rather_than_one_winner: >-
      The two highest-value routes fail for opposite reasons: R5 is blocked on
      authority, not merit; R3 is unblocked but proves only the lowest tier of the
      closure ladder. Choosing either alone discards real value. The prompt permits a
      staged portfolio and forbids manufacturing a single winner.
    score: 10
    disposition: SELECTED
    refs: [route.03_track_a_organogenesis, route.02_phase_zero_first, route.05_daleobanks_cash_engine, route.11_execution_surface_first]

  # ------------------------------------------------------- strengthening pass 1
  - id: deliberation.pass1
    kind: strengthening_pass
    title: "Pass 1 — steelman, amplify, redesign disadvantages"
    evidence_status: derived
    pass_number: 1
    subject: route.12_portfolio
    refs: [route.12_portfolio, route.03_track_a_organogenesis, route.05_daleobanks_cash_engine, decision.controlling_fact]
    roles_present:
      founder_intent_steward: >-
        The portfolio preserves the full horizon. Nothing is deleted; R4, R5, R7, R8
        and R9 are deferred with named re-entry conditions, satisfying Override §2
        and §28. The primary track advances the §10 milestone directly.
      systems_architect: >-
        R3 is the only route whose dependencies are entirely inside the repository.
        Its laboratory exists: frozen spec, hashed subject files, a 4/4 threshold, a
        detector told only the capability name. The engineering delta is process
        isolation and held-out confinement, not new architecture.
      adversarial_reviewer: >-
        A computational closure over a capability nobody consumes is exactly the
        elegant-progress-without-reality failure §26 warns about. If this round
        recommends it without labelling the tier, it manufactures the deception it
        was convened to prevent.
      operator_maintainer: >-
        69 open PRs, four based on an archived main. Any new work must land, not
        queue. A route that adds a 70th unlandable PR is worse than doing nothing.
      evidence_welfare_guardian: >-
        Zero external effects, zero participants, zero data subjects in the primary
        track. Welfare risk is nil precisely because nothing touches anyone — which
        is also the reason it cannot claim institutional or economic value.
    baseline_comparison: "Do-nothing (R10) scores 2 and is beaten on knowledge value and on stopping backlog growth."
    simplest_viable_alternative: >-
      Write the two missing organ manifests and stop (a slice of R2). Cheaper, but
      produces no closure of any tier and leaves the developmental engine unproven.
    strongest_competing_architecture: >-
      R5 (DALEOBANKS cash engine) genuinely dominates on commercial value and is the
      only route that addresses the fragility Override §18 names. It loses here only
      because it needs a founder authority this round cannot grant.
    disadvantages_identified:
      - D1: computational closure risks being read as real progress
      - D2: the target capability's output has no consumer
      - D3: adds to a 69-PR backlog that already cannot drain
      - D4: the evaluator is not yet process-isolated, so "candidates cannot alter it" is not fully true
      - D5: primary track produces no revenue while §18 says financing fragility is real
    redesigns_applied:
      - "D1 → every closure claim must carry its §11 ladder tier in the artifact itself; 'computational' may never be reported unqualified."
      - "D2 → accepted and stated openly rather than engineered away; the closure proves the BRIDGE region, and the artifact says so."
      - "D3 → the implementation program is a dependency-ordered stack against current main, never onto an archived base, and PR count is capped."
      - "D4 → process isolation and held-out confinement become entry conditions for the closure, not follow-ups."
      - "D5 → R5 is designated first-to-unblock and its founder gate is written now, so the decision is ready the moment the founder is."
    reversible_experiment: >-
      The closure runs in a sandbox against a disabled copy; the original linker is
      hash-pinned and untouched; rollback is deleting a branch.
    rejected_alternatives_preserved: [route.01_pr66_first, route.06_golden_kernel_v2, route.07_wmi_first, route.08_pumpstation_first, route.09_morphogenetic_substrate, route.10_do_nothing]

  # ------------------------------------------------------- strengthening pass 2
  - id: deliberation.pass2
    kind: strengthening_pass
    title: "Pass 2 — attack the strengthened design, then settle"
    evidence_status: derived
    pass_number: 2
    subject: route.12_portfolio
    refs: [deliberation.pass1, route.12_portfolio, capability.evaluator_firewall_partially_exists, discrepancy.stacked_pr_backlog]
    attacks:
      bureaucracy: >-
        The planning compiler could become the institution's fourth registry system.
        Override §27 anticipates this and requires a disposition; one is returned.
      centralization: "None added — the round creates no authority and no gate."
      fragility: >-
        The portfolio depends on the founder eventually unblocking R5. If that never
        happens, UNIIMENTE accumulates developmental capability it cannot finance.
        This is a real, unresolved dependency and is recorded as such rather than
        assumed away.
      overfit: >-
        Tuning the developmental engine to one capability (cross_organ_edge_resolution)
        risks an engine that only repairs that. Mitigation: the second closure must
        target an unrelated function, and that requirement is written into the exit
        criteria rather than left to judgement.
      cost: "Near zero — no credentials, no spend, no external surface."
      incomprehensibility: >-
        Genuine risk. The kernel already has 22 packages and five registries. The
        program adds no new package to the runtime.
      irreversibility: "None. Every artifact is a branch; every attachment is consequence-inert and detachable."
      gaming: >-
        The sharpest attack: a builder that can read the evaluator can satisfy it
        without solving anything. This is why D4's fix is an entry condition and not
        a follow-up — without isolation the whole closure is worthless.
      dependency: "No new provider, platform or vendor dependency."
      theater: >-
        The strongest attack of all. The honest answer is that a computational
        closure IS a small result, and the round says so in those words rather than
        dressing it as institutional progress.
    pass1_disadvantages_revisited:
      D1: "Addressed — ladder tier is now mandatory in every closure artifact."
      D2: "Not fixable; stated openly. The capability's output has no consumer and the closure proves the BRIDGE only."
      D3: "Addressed — stack ordering rule and PR cap; stale-base PRs are triaged before new ones are opened."
      D4: "Promoted from follow-up to entry condition. Without isolation, do not run the experiment."
      D5: "Unresolved by engineering. Escalated as the round's primary founder decision."
    residual_risks:
      - "The founder may never unblock R5, leaving capability without financing."
      - "The developmental engine may succeed on one capability and generalize to none."
      - "The 69-PR backlog may absorb this work as it absorbed the rest."
      - "PR #66's five falsified designs may indicate the underlying lifecycle model is wrong, which freezing does not resolve."
    rollback: "Delete the planning branch. main is untouched at 8cb3074 throughout."
    disposition: RETAIN
    note: "Exactly two passes. No third pass was run."

  # ------------------------------------------------------------------- decisions
  - id: decision.final
    kind: decision
    title: FINAL DECISION — staged portfolio, primary disposition BUILD
    evidence_status: verified_by_execution
    primary_disposition: BUILD
    active_whole_project_node: "First verified developmental closure (computational tier)"
    active_bottleneck: >-
      No governed process has ever carried an input to a verified consequence. The
      nearest reachable instance of that shape, with zero external dependencies, is a
      developmental closure over a real institutional capability.
    active_sbm: VERIFIED_DEVELOPMENTAL_CLOSURES
    active_sbm_baseline: 0
    active_sbm_target: 1
    active_sbm_tier: "COMPUTATIONAL — per Override §11. May not be reported as institutional or economic closure."
    first_decisive_proof: >-
      Disable institutional.cross_organ_edge_resolution; generate at least five
      materially different replacements via isolated AI builders; judge them under
      the frozen SPEC_SHA256 evaluator running in a separate process with held-out
      cases the builders cannot read; attach a qualifying champion in a
      consequence-inert registry; verify 4/4 restoration; preserve lineage, specialists,
      failures and rollback; leave linker/ byte-identical to its pinned hashes.
    entry_conditions_that_gate_the_experiment:
      - builder and evaluator run in separate processes
      - candidate writable paths are confined and enforced
      - held-out cases exist and are unreadable by builders
      - a negative control proves the evaluator can fail
      - evaluator mutation is detectable
    strongest_counterargument: >-
      A computational closure over a capability whose output nothing consumes changes
      nothing in reality, and pursuing it while the only cash engine stays unbuilt is
      how an institution optimizes itself into irrelevance.
    falsification_condition: >-
      If the closure completes and no second, unrelated capability can be closed by
      the same engine within one further cycle, the developmental engine is overfit
      to one target and Track A's premise is wrong. Kill the generalization claim and
      re-run this tournament with R5 unblocked.
    decisive_unknown: "Whether the founder will authorize the DALEOBANKS publishing route, which determines whether capability can ever be financed."
    dispositions:
      pr_66: FREEZE_AS_TRACK_B_RESEARCH
      pr_66_note: >-
        Preserve entirely. Its instruments, adversarial controls, five falsified
        designs and measurement-integrity findings are institutional evidence of high
        value. Do not merge, do not continue runtime work, do not delete. Its own
        recorded dissent — that the conventional workflow engine still wins — is the
        reason it must not gate Track A.
      track_a: BUILD
      track_b: RESEARCH — registered challenger with a defined re-entry condition
      phase_zero: RETAIN_AS_SUPPORTING_TRACK — write the two missing organ manifests, wire the adapters
      golden_kernel_v2: DEFER — authority is not the measured bottleneck
      first_developmental_closure: BUILD
      first_economic_closure: NEEDS_FOUNDER_DECISION
      daleobanks_commercialization: NEEDS_FOUNDER_DECISION — first route to unblock
      wmi_integration: DEFER — triage the stacked backlog before adding capacity
      pumpstation_integration: DEFER — write its organ manifest first
      build_your_own_x: RETAIN as read-only mechanism atlas
      physical_embodiment_research: DEFER — preserved as aspiration, no current route
      future_scientific_program: DEFER — preserved as aspiration, gated on economic closure
      planning_compiler: >-
        REDUCE — retain the graph and generated artifacts as the planning record;
        do not extend the compiler further unless a second planning round needs it.
