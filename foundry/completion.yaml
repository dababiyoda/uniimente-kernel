# All 55 obligations remain active; COMPLETE is bounded local contract evidence, never full-machine completion.
1:
  acceptance:
  - Compiles policy, workflow, experiment and business-genome source into executable objects
  - Rejects invalid source with located errors before execution
  - Compiled output is deterministic (same source, same hash)
  evidence: foundry/evidence/system-01.json
  implementation:
  - foundry/systems/compiler.py
  - compiler/ucl_compiler.py
  - business/genome.py
  - foundry/systems/__init__.py
  - greg/foundry_bridge.py
  interface: foundry.query compile; foundry.apply compile_and_store (system 1)
  limitations: Six kinds (workflow, policy, experiment, business, organ_charter, swarm_contract) over YAML sources;
    the constitution itself stays with compiler/ucl_compiler.py. Business errors are located at the field the genome
    owner names.
  recovery: Stateless and deterministic; compiled objects are content-addressed (#36) and recompile identically
    from source.
  state: COMPLETE
  tests:
  - tests/unit/test_foundry_systems.py
2:
  acceptance:
  - Restricted languages exist for pricing, budgets and capital rules, not only policy
  - An out-of-grammar, undeclared or over-ceiling rule is rejected before or at execution
  - Evaluation never executes arbitrary code
  evidence: foundry/evidence/system-02.json
  implementation:
  - foundry/systems/dsl.py
  - foundry/systems/__init__.py
  - greg/foundry_bridge.py
  interface: foundry.query run|check
  limitations: 'Expression rules only (no loops, no state); three languages: pricing, budget, capital; no exponentiation
    by design.'
  recovery: Stateless; a refused rule never runs.
  state: COMPLETE
  tests:
  - tests/unit/test_foundry_systems.py
3:
  acceptance:
  - Institutional objects are versioned with ancestry, reason and evidence per version
  - Stale concurrent writes are refused (compare-and-swap)
  - Rollback creates a new version; no history is rewritten
  - Any two versions can be diffed
  evidence: foundry/evidence/system-03.json
  implementation:
  - foundry/systems/versions.py
  - foundry/systems/__init__.py
  - greg/foundry_bridge.py
  interface: foundry.apply commit|rollback; foundry.query history|content|diff
  limitations: 'Per-mission workspace store; single machine (fcntl lock); no signed versions yet (planned with #7).'
  recovery: Refs move only by compare-and-swap; a crashed commit leaves the prior head valid; rollback is a new
    version.
  state: COMPLETE
  tests:
  - tests/unit/test_foundry_systems.py
