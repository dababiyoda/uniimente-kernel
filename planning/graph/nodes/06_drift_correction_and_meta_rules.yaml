  - id: meta.reporting_contract
    kind: protected_intent
    title: "PERMANENT META-RULE — reporting contract, six epistemic classes"
    evidence_status: verified_by_inspection
    protected: true
    override_section: "continuation-19"
    classes:
      KNOWN: directly inspected or executed
      INFERRED: strongly supported but not directly proven
      PROPOSED: architecture not yet implemented
      ASPIRATIONAL: founder-intended future state
      UNRESOLVED: missing evidence
      FALSIFIED: tested and contradicted
    rule: "Never collapse them."
    every_report_ends_with:
      - active bottleneck
      - active SBM, exact baseline, current target
      - phase completed and its evidence
      - new capability created
      - new reusable primitive, if any
      - upward synthesis proposal, if earned
      - strongest counterargument
      - falsification test
      - next smallest bounded implementation
      - confirmation that founder intent was not silently weakened
    evidence_refs:
      - repo: founder-instruction
        sha: continuation-order-2026-08-08
        symbol: "§19 Reporting contract"

  - id: meta.p3_real_consumer_requirement
    kind: protected_intent
    title: "PERMANENT — P3 must build a real consumer, never a fixture"
    evidence_status: verified_by_inspection
    protected: true
    override_section: "continuation-7"
    prohibited_consumers: [test_consumer, dummy_consumer, fixture_consumer, closure_demo_consumer]
    prohibition_reason: "That would satisfy syntax while violating intention."
    required_geometry: >-
      organ manifests + contract schemas -> institutional.cross_organ_edge_resolution
      -> LinkReport / proven topology -> runtime internal subscription topology ->
      event routes instantiated ONLY for proven edges -> internal cross-organ
      messages travel those routes.
    consequence_when_capability_disabled: "runtime cannot establish required proven routes; an actual internal function disappears"
    consequence_when_restored: "runtime rebuilds proven topology; internal work routes through the replacement-derived topology; function observably restored"
    why: "This makes closure conditions 2 and 7 structurally real rather than asserted."
    reuse_constraint: >-
      Investigate whether InstitutionalLinker, the event infrastructure, adapters,
      organ manifests, WholeBodyClosureController and the registries can support
      this without inventing a parallel architecture. Prefer reuse. Do not
      reimplement the linker. Do not create a second authority source.
    authority_limit: >-
      The runtime topology consumer may decide INTERNAL ROUTING based on proven
      topology. It may not grant new constitutional authority.
    refs: [sbm.strengthened_closure_definition, capability.adapters_membrane_orphaned, bridge.linker_measured_state]
    evidence_refs:
      - repo: founder-instruction
        sha: continuation-order-2026-08-08
        symbol: "§7 P3 — build a real consumer, not a fixture"

  - id: meta.evaluator_isolation_correction
    kind: protected_intent
    title: "PERMANENT — 'separate subprocess' is NOT sufficient isolation"
    evidence_status: verified_by_inspection
    protected: true
    override_section: "continuation-5"
    correction: >-
      A child process under the same user that can read the repository can still
      read the evaluator. Subprocess separation is not an unreadability boundary.
    candidates_must_not_be_able_to:
      - read protected evaluator source
      - read held-out cases
      - traverse to the parent repository
      - import evaluator modules
      - inspect evaluator environment variables
      - access Git history containing hidden cases
      - access network services capable of retrieving hidden cases
      - modify the evaluator
      - modify the frozen contract
      - modify constitutional state
      - modify authority state
      - write outside their chamber
    required_negative_controls:
      - malicious candidate reads held-out cases
      - malicious candidate reads evaluator source
      - malicious candidate writes protected files
      - malicious candidate escapes its directory
      - malicious candidate accesses the network
      - malicious candidate modifies its own evaluation result
    failure_disposition: >-
      If the environment cannot provide an actual unreadability boundary, P2 must
      report EVALUATOR_ISOLATION_NOT_PROVEN and the decisive closure may NOT run.
      Do not simulate blindness.
    rule: "'No file happened to be read' is not evidence."
    refs: [intent.evaluator_sovereignty, capability.evaluator_firewall_partially_exists]
    evidence_refs:
      - repo: founder-instruction
        sha: continuation-order-2026-08-08
        symbol: "§5 P2 — evaluator sovereignty"

  - id: meta.context_contamination
    kind: protected_intent
    title: "PERMANENT — a contaminated session may not be its own blind builder"
    evidence_status: verified_by_inspection
    protected: true
    override_section: "continuation-6"
    rule: >-
      This session has already inspected significant repository information. It
      may implement runtime, evaluator, candidate-builder, isolation,
      orchestration, evidence-recording and test infrastructure. If it has read
      decisive held-out material, it may NOT itself count as a blinded candidate
      builder for the final closure proof.
    fresh_builders_receive:
      - the public target capability contract
      - authorized substrate excerpts
      - allowed interfaces
      - resource ceilings
      - candidate output schema
    fresh_builders_must_not_receive:
      - evaluator implementation
      - decisive held-out cases
      - expected answers
      - previous candidate solutions unless the experiment explicitly permits them
    rule_2: "A model pretending to forget information is not a blind experiment."
    evidence_refs:
      - repo: founder-instruction
        sha: continuation-order-2026-08-08
        symbol: "§6 Context contamination rule"

  - id: meta.generalization_falsification
    kind: protected_intent
    title: "PERMANENT — one closure proves nothing about generality"
    evidence_status: verified_by_inspection
    protected: true
    override_section: "continuation-15"
    rule: >-
      After the first closure succeeds, do NOT declare a general developmental
      engine. Select a SECOND unrelated capability deficit — not cross-organ edge
      resolution — pre-register it, and use the SAME machinery.
    failure_disposition: >-
      If the engine cannot generate and close a materially different second
      deficit within one further bounded cycle, classify DEVELOPMENTAL_ENGINE_OVERFIT
      and reopen the architecture.
    real_progression: "closure 1 -> closure 2 in a different problem geometry -> several closures -> reusable developmental machinery"
    not: "one impressive demo -> 'recursive intelligence achieved'"
    refs: [backcast.node_2_generalization, sbm.strengthened_closure_definition]
    evidence_refs:
      - repo: founder-instruction
        sha: continuation-order-2026-08-08
        symbol: "§15 P10 — immediately try to falsify the generalization"
