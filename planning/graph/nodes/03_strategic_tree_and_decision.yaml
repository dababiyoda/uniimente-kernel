      Disable a real institutional capability, have AI builders generate materially
      different replacements in isolation, judge them with a frozen evaluator the
      candidates cannot alter, attach the winner in a consequence-inert registry,
      verify restoration, preserve lineage and rollback.
    first_wedge: >-
      institutional.cross_organ_edge_resolution — the target is already declared in
      evolution/repair/spec.py, the subject (linker/) is already hashed file-by-file,
      the threshold is already 4/4, and the spec already self-seals via SPEC_SHA256.
    time_to_proof: "short — the laboratory exists; the missing pieces are process isolation and held-out confinement"
    capital_need: none
    founder_attention: low
    external_dependencies: NONE
    commercial_value: none_directly
    knowledge_value: very_high
    durable_assets: "a working developmental engine; the first Capability Genome; a reusable evaluator firewall"
    reversibility: high
    strongest_counterexample: >-
      It restores a capability whose output nothing consumes. A successful closure
      proves the BRIDGE region works while the RIGHT region stays inert — precisely
      the recursive self-deception Override §26 names as the greatest strategic risk.
    attack_survived: >-
      The objection is real and is answered by labelling, not by argument: this is
      COMPUTATIONAL closure and must be recorded as such on the §11 ladder. It may
      never be reported as institutional or economic closure. With that label it is
      still the only 0→1 proof reachable with zero external dependencies.
    hard_gate_result: PASSES
    score: 9
    disposition: RETAIN_AS_PRIMARY
    refs: [capability.evolution_laboratory, capability.evaluator_firewall_partially_exists, intent.first_developmental_proof, intent.closure_ladder]
    evidence_refs:
