name: Canonical CI

# The single official workflow for the canonical line.
#
# EXACTLY ONE RUN PER CHANGE. `pull_request` validates every proposed change;
# `push` fires only on `main`, after merge. A branch with an open PR therefore
# produces one run, not two. `workflow_dispatch` exists so an unchanged commit
# can be re-run in a clean environment for release evidence.
#
# The four jobs below are the required checks named in the Package 1 order.
# The two pre-existing workflows (tests.yml, ade1-standing-cognition.yml) are
# preserved but reduced to manual dispatch so they cannot double-execute.
# They are not deleted: UNIIMENTE_FINAL_BUILD_ORDER §2 and §12 forbid
# destructive simplification.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: "1 · Kernel and organ tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Full unit and integration suite
        run: python -m pytest -q
      # RUNS EVEN THOUGH THE SUITE ABOVE IS EXPECTED TO FAIL.
      #
      # Every specification on this branch is xfail(strict=True), so a spec that
      # starts passing is reported as a FAILURE until its marker is removed in a
      # reviewable commit. That makes the pytest step intentionally red, and a
      # verifier step that only runs on success silently stops running the
      # moment the discipline starts working. "Canonical CI ran" would then mean
      # the unit suite produced the intended red signal and nothing more.
      #
      # The job still fails overall: `if: always()` changes what EXECUTES, not
      # what the job concludes.
      - name: Institutional verifier V1-V5
        if: always()
        run: python verifier/v2/verify.py
      # LC-1. A corrected test that passes proves nothing on its own. This
      # re-attacks it with three broken routing candidates and fails if any
      # escapes, or if the unmodified runtime stops satisfying the oracle -- a
      # negative control that fails against a runtime where everything fails is
      # not evidence. It imports the test module so the attack and the test
      # share one oracle and cannot drift apart, which is why it lives in this
      # job rather than in the dependency-free ancestry job.
      #
      # `if: always()` for the same reason as the verifier above: the suite is
      # expected to go red whenever a strict xfail starts passing, and a control
      # that only runs on success stops running exactly when it is needed.
      - name: Phase 3G adopted-edge return negative control
        if: always()
        run: python verification/phase3g/adopted_edge_return_negative_control.py --verify-results
      # LC-2a. Fails if the recorded edge-liability diagnosis stops describing
      # this runtime -- if the dense fixture starts stranding edges, if the
      # sparse one stops, if CLOSED_CHILD_EDGES comes alive, or if the audit
      # stops noticing a deliberately stranded edge. A diagnosis nothing
      # re-executes decays into a claim the moment the runtime moves.
      - name: Phase 3G edge-liability diagnosis
        if: always()
        run: python verification/phase3g/edge_liability_diagnose.py --verify-results

  contracts:
    name: "2 · Contract schema references resolve"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Every document-local $ref resolves across contracts/**
        run: python scripts/ci/check_schema_refs.py

  authority:
    name: "3 · One source of authority"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The filename-counting singleton check was retired by founder
      # Decision A and lives at scripts/ci/historical/ as provenance. It is
      # deliberately NOT run: two machine checks must not express contradictory
      # definitions of canonical authority.
      # Added by RC1. The check above counts FILENAMES; this one checks the
      # actual institutional invariant (one issuer, one protocol, zero organ
      # -local issuers, zero active legacy authorizers) and reads the canonical
      # manifest rather than its own list. The older check is deliberately NOT
      # removed or rewritten here: a component must not alter its own approval
      # requirements, and its proposed replacement is preserved for review.
      - name: Canonical authority - one valid certificate issuer
        run: |
          pip install -r requirements-dev.txt
          python scripts/ci/check_canonical_authority.py

  sealed:
    name: "4 · Developmental work stays sealed"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Zero external effects, no self-granted authority
        run: python scripts/ci/check_sealed_developmental.py
      - name: TARGET_FORM_001 benchmark evidence
        run: python -m developmental > target_form_001_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: target-form-001-report
          path: target_form_001_report.json
          if-no-files-found: error
          retention-days: 90
