name: PumpStation registration proposal autofix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/register-pumpstation-venture-cell'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/register-pumpstation-venture-cell
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check --fix tests/test_pumpstation_registration_proposal.py
      - run: black tests/test_pumpstation_registration_proposal.py
      - run: pytest -q tests/test_pumpstation_registration_proposal.py
      - name: Commit verified formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_pumpstation_registration_proposal.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No formatting change required.'
          else
            git commit -m 'Format PumpStation registration proposal tests'
            git push origin HEAD:agent/register-pumpstation-venture-cell
          fi
