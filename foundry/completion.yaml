  gap: 'Non-privileged mechanism implemented (foundry/systems/segmentation.py): components launched through run_confined
    run under the Kernel seccomp filter (no socket of any family, no connect/io_uring/pidfd_getfd/setns; kernel-enforced)
    and reach only identity-allowlisted endpoints through one relay that journals every decision in a hash chain;
    exercised on loopback and RFC 5737 TEST-NET only. The relay chains through a mandated HTTP CONNECT proxy
    (HTTPS_PROXY; credentials never journaled), the 2026-09-30 negative evidence being that a direct connection bypassed
    the configured proxy. http.get runs as a confined component behind the body relay when the body is initialized with
    --confined-egress (TLS verified inside the confined child; tests/integration/test_greg_confined_egress.py, loopback
    fake proxy and TLS server only). github.pulls and brief.engineering read GitHub the same way (the credential travels
    on the stdin of the confined child only, never in argv, environment, journal or receipt; chunked replies decoded;
    header injection refused). browser.render, browser.session and coding workers run in a bubblewrap network
    namespace whose only way out is a door to the same relay (foundry/systems/relay_door.py): an HTTP CONNECT front on
    the namespace loopback, each request decided against the identity allowlist and journaled; the browsers are
    allowlisted for the signed origins alone, workers for their provider endpoint (tests/integration/
    test_greg_confined_egress.py, loopback only). Playwright starts browser.session''s Chromium from its own driver, so
    that door reaches the relay over a one-time Unix socket in the session''s private directory and Chromium keeps only
    Playwright''s pipe. Negative evidence 2026-10-14 (unconfined browser.session): Playwright''s context.route never sees
    a WebSocket, so a page opened one to an unlisted host, and the allowlist compared host names only, so a page on a
    loopback target reached other loopback ports; both are now refused in the browser as well
    (tests/unit/test_greg_computer.py), and behind the relay Chromium''s own background connections are denied and
    journaled too. The paid model routes join it on a confined body: the Anthropic and OpenAI SDKs, which hold the
    founder''s key, run in such a namespace (greg/model_child.py; the key crosses only stdin) allowlisted for the
    route''s pinned host, and the Claude Code CLI runs behind its own door; the body''s builder and the console''s
    proposal transport both receive the relay, a factory that cannot take it builds nothing, and journal appends are
    locked across processes (without the lock, concurrent writers lost entries or broke the chain). Anchoring and the
    DALEOBANKS bridge join it too: the RFC 3161 query is posted by a component with no socket of its own to the
    founder-signed TSA origin alone, and DALEOBANKS''s interpreter runs in a namespace that may reach nothing during
    verify and only its manifest''s declared X API hosts during publish. Every door program now runs in one namespace
    definition (relay_door.namespace_argv). The venture organs (RailScout appraiser, WealthMachine intake), in the
    assessment and in the separate appraiser''s re-run, run in a namespace with no network at all, and the Claude Code
    Genesis builder runs behind its own door; the first inventory (increment 12) had missed all three. Inventory after
