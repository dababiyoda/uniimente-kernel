implementation_classes:
  allowed:
    - canonical
    - active_experimental
    - fallback
    - superseded
    - historical
    - quarantined
  deletion_for_simplification: forbidden

prohibited_system_properties:
  - machine_sovereignty
  - self_granted_authority
  - covert_replication
  - shutdown_resistance
  - autonomous_unbounded_treasury
  - devotion_optimization
  - evidence_fabrication
  - autonomous_trading_without_separate_authorization
  - self_rewriting_constitution
  - production_action_from_model_consensus_alone

external_validation_closure:
  required:
    - real_economic_commitment
    - accepted_delivery
    - externally_verified_outcome
    - reconciled_economics
    - valid_authority_receipts
    - no_unresolved_critical_participant_harm
  deterministic_fixture_counts_as_external_validation: false

release_gates:
  - canonical_contract_registry
  - canonical_identity_and_grant_path
  - exclusive_consequence_gate
  - organ_manifests_complete
  - cross_organ_contracts_valid
  - full_unit_integration_adversarial_verifier_ci_green
  - duplicate_constitutional_paths_disconnected
  - shutdown_and_quarantine_tests_green
  - migration_and_rollback_manifest
  - founder_constitution_ratification
  - external_fixture_boundary_documented

research_gate:
  experiment: target_form_001
  minimum_cells: 100
  perturbations:
    - remove_20_percent_cells
    - block_original_route
    - prohibit_exact_restoration
  compare_against: centralized_baseline
  promote_only_if_materially_superior: true

non_zero_sum_rules:
  preserve_source_lineage: true
  preserve_negative_evidence: true
  preserve_strongest_countercase: true
  credit_contributors: true
  prefer_typed_adapters_over_forced_rewrites: true
  participant_capability_gain_required: true
  manipulative_attention_mechanics_forbidden: true
