# Evidence binding for the 55-technology Foundry arsenal (foundry/arsenal.py).
#
# The arsenal status is read by FoundryComposer: it ranks candidates by status
# and emits deployment_blocker notes for target technologies. A status is
# therefore an operational input, not prose. This file binds every status to
# checkable evidence so the Composer cannot rank on an unsupported claim.
#
# Status rules (enforced by tests/unit/test_arsenal_evidence.py):
#   executable - at least one kernel implementation path AND one kernel test
#                path, all existing. Means "runs and is tested inside the
#                kernel for its bounded scope". Never means production,
#                external verification, or revenue.
#   partial    - at least one kernel path or organ reference showing a real
#                fragment of the mechanism. Kernel paths must exist. Organ
#                references ("REPO:path") are recorded, not verified here.
#   target     - architecture only. No evidence required; the gap is.
#
# Every entry names the residual gap and the commodity mechanisms to adopt
# before anything is built (resourcefulness ladder, FOUNDER_EFFECT_COMPILER).
# Audited against uniimente-kernel 04b1b7e, DALEOBANKS e2f1ebe and
# WealthMachineIntelligence ec82b80 on 2026-09-26.

1:
  implementation: [compiler/ucl_compiler.py, compiler/ucl_parser.py, evolution/experiment.py]
  tests: [tests/unit/test_ucl_compiler.py]
  gap: UCL compiles constitutional policy and experiments; no Business, Organ Charter or Swarm Contract compilers.
  adopt: [OPA/Rego, Cedar]
