      an authorized goal keeps pulling its signed missions (timing, ordering, preparation and asks) across ticks and
      restarts, without adding, dropping or widening a mission
    refines: [OWN-0008]
    owner_status: NEEDS_FOUNDER_DECISION
    canonical: []
    candidates:
      - side: A
        module: greg.goal_gravity
        qualnames: [tick]
        evidence:
          - "Body.tick calls goal_gravity.tick before the mission engine on every tick (greg/body.py)"
          - "ADR-GOAL-GRAVITY-002 (status proposed) names it 'one canonical persistent operating path'"
      - side: A
        module: egregore.gravity
        qualnames: [GoalGravityLoop]
        evidence:
          - "greg/goal_gravity.py runs GoalGravityLoop.turn in body mode (no gate, executor or grant)"
          - "its standalone gate and executor mode stays for non-body ledgers; ADR-GOAL-GRAVITY-002 graft 9 keeps both lineages"
